<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Historical Vegetation Navigator</title>


  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body {

      height: 100%;
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

      overflow: hidden;

    }


    #map {

      height: 100%;
      width: 100%;

    }


    /* =====================================================
       COMPACT CONTROLS
       ===================================================== */

    #controls {

      position: absolute;

      top: 8px;
      left: 8px;

      right: auto;

      max-width: calc(100% - 16px);

      z-index: 1000;

      background: rgba(255,255,255,0.94);

      padding: 7px;

      border-radius: 7px;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.22);

      box-sizing: border-box;

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      font-size: 14px;

      padding: 7px 10px;

      margin-right: 4px;

      margin-bottom: 4px;

      border: none;

      border-radius: 6px;

      background: #2c6e49;

      color: white;

      line-height: 1.1;

    }


    button:active {

      background: #1f5035;

    }


    #vegetationButton.active {

      background: #8b5a2b;

    }


    #currentButton.active {

      background: #245c9c;

    }


    /* =====================================================
       GPS DETAILS BUTTON
       ===================================================== */

    #gpsDetailsButton {

      display: none;

      background: #555;

      font-size: 12px;

      padding: 5px 8px;

      margin-top: 2px;

      margin-bottom: 3px;

    }


    #gpsDetailsButton.active {

      background: #333;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      margin-top: 3px;

      font-size: 12px;

      line-height: 1.25;

      max-width: 300px;

    }


    /* =====================================================
       CURRENT VEGETATION BOX
       ===================================================== */

    #currentVegetation {

      display: none;

      margin-top: 6px;

      padding: 7px;

      border-radius: 6px;

      background: rgba(243,243,243,0.95);

      border-left: 4px solid #2c6e49;

      max-width: 300px;

    }


    #currentTitle {

      font-size: 11px;

      font-weight: bold;

      color: #555;

      margin-bottom: 3px;

    }


    #currentType {

      font-size: 17px;

      font-weight: bold;

      line-height: 1.15;

    }


    #currentDetails {

      margin-top: 4px;

      font-size: 11px;

      line-height: 1.25;

      color: #555;

    }


    /* =====================================================
       MNFI COMMUNITY LINK
       ===================================================== */

    .mnfiLink {

      display: inline-block;

      margin-top: 8px;

      padding: 6px 8px;

      background: #2c6e49;

      color: white !important;

      text-decoration: none;

      border-radius: 5px;

      font-weight: bold;

      font-size: 12px;

    }


    .mnfiLink:hover {

      background: #1f5035;

    }


    .tensionNote {

      margin-top: 5px;

      font-size: 10px;

      color: #666;

      line-height: 1.2;

    }


    /* =====================================================
       SMALL SCREENS
       ===================================================== */

    @media (max-width: 500px) {

      #controls {

        top: 6px;
        left: 6px;

        padding: 6px;

        max-width: calc(100% - 12px);

      }


      button {

        font-size: 13px;

        padding: 6px 8px;

        margin-right: 3px;

        margin-bottom: 3px;

      }


      #gpsDetailsButton {

        font-size: 11px;

        padding: 5px 7px;

      }


      #status {

        font-size: 11px;

        line-height: 1.2;

        max-width: 280px;

      }


      #currentVegetation {

        max-width: 280px;

        padding: 6px;

        margin-top: 5px;

      }


      #currentTitle {

        font-size: 10px;

      }


      #currentType {

        font-size: 15px;

      }


      #currentDetails {

        font-size: 10px;

      }


      .mnfiLink {

        font-size: 11px;

        padding: 5px 7px;

      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       CONTROLS
       ======================================================= -->

  <div id="controls">


    <button
      id="gpsButton"
      onclick="toggleGPS()"
    >

      GPS OFF

    </button>


    <button
      id="vegetationButton"
      onclick="toggleVegetation()"
    >

      Vegetation OFF

    </button>


    <button
      id="currentButton"
      onclick="toggleCurrentVegetation()"
    >

      Current Vegetation

    </button>


    <button
      id="gpsDetailsButton"
      onclick="toggleGPSDetails()"
    >

      GPS Details

    </button>


    <div id="status">

      GPS OFF

    </div>


    <!-- CURRENT VEGETATION DISPLAY -->

    <div id="currentVegetation">

      <div id="currentTitle">

        HISTORICAL VEGETATION AT YOUR LOCATION

      </div>


      <div id="currentType">

        Searching...

      </div>


      <div id="currentDetails">

      </div>

    </div>


  </div>


  <!-- MAP -->

  <div id="map"></div>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* ========================================================
       MAP
       ======================================================== */

    const map = L.map("map").setView(

      [44.5, -84.5],

      7

    );


    /* ========================================================
       BASEMAP
       ======================================================== */

    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }

    ).addTo(map);


    /* ========================================================
       GPS VARIABLES
       ======================================================== */

    let gpsMarker = null;

    let gpsAccuracyCircle = null;

    let watchID = null;

    let gpsHasCentered = false;

    let gpsDetailsVisible = false;

    let latestGPSData = null;

    let lastMapCenterTime = 0;

    const gpsCenterInterval = 500;


    /* ========================================================
       VEGETATION VARIABLES
       ======================================================== */

    let vegetationLayer = null;

    let vegetationVisible = false;

    let lastVegetationCenter = null;


    /* ========================================================
       CURRENT VEGETATION VARIABLES
       ======================================================== */

    let currentVegetationVisible = false;

    let lastVegetationPosition = null;

    let lastState = null;


    /* ========================================================
       HISTORICAL VEGETATION SERVICE
       ======================================================== */

    const michiganURL =

      "https://gisp.mcgi.state.mi.us/arcgis/rest/services/EGLE/LandCoverType_1800/FeatureServer/0";


    /* ========================================================
       TENSION ZONE
       ========================================================

       TEMPORARY STRAIGHT-LINE APPROXIMATION

       North of 43.5 N  = Northern
       South of 43.5 N  = Southern

       This is intentionally a simple approximation for now.
       The actual Michigan floristic/climatic tension zone is
       irregular rather than a straight east-west line.

       ======================================================== */

    const TENSION_ZONE_LATITUDE = 43.5;


    /* ========================================================
       MNFI COMMUNITY URLS
       ========================================================

       These are actual MNFI community-description pages.

       Only reasonably defensible matches are included.

       ======================================================== */

    const MNFI_COMMUNITIES = {

      "mesic northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10687/mesic-northern-forest",

      "mesic southern forest":
        "https://mnfi.anr.msu.edu/communities/description/10684/Mesic-Southern-Forest",

      "dry-mesic northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10688/dry-mesic-northern-forest",

      "dry northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10689/Dry-Northern-Forest/1000",

      "dry southern forest":
        "https://mnfi.anr.msu.edu/communities/description/10686",

      "dry-mesic southern forest":
        "https://mnfi.anr.msu.edu/communities/description/10685/dry-mesic-southern-forest",

      "boreal forest":
        "https://mnfi.anr.msu.edu/communities/description/10690/boreal-forest/",

      "northern hardwood swamp":
        "https://mnfi.anr.msu.edu/communities/description/10659/northern-hardwood-swamp",

      "rich conifer swamp":
        "https://mnfi.anr.msu.edu/communities/description/10652/Rich-Conifer-Swamp",

      "oak-pine barrens":
        "https://mnfi.anr.msu.edu/communities/description/10692/Oak-pine-barrens",

      "oak barrens":
        "https://mnfi.anr.msu.edu/communities/description/10693/Oak-barrens",

      "pine barrens":
        "https://mnfi.anr.msu.edu/communities/description/10694",

      "dry sand prairie":
        "https://mnfi.anr.msu.edu/communities/description/10698/Dry-Sand-Prairie/1000"

    };


    /* ========================================================
       FOREST TYPE -> COMMUNITY CLASSIFICATION
       ========================================================

       The circa-1800 vegetation layer and the modern MNFI
       natural-community classification are NOT identical
       classification systems.

       Therefore this table deliberately uses only defensible
       associations.

       ======================================================== */

    const MICHIGAN_COMMUNITY_MAP = {


      /*
       * MESIC NORTHERN / SOUTHERN
       *
       * These are explicitly divided by the temporary
       * straight-line tension-zone approximation.
       */

      "BEECH-SUGAR MAPLE FOREST":
        {
          tensionZone: true,
          north:
            "Mesic Northern Forest",
          south:
            "Mesic Southern Forest"
        },


      "SUGAR MAPLE-BASSWOOD FOREST":
        {
          tensionZone: true,
          north:
            "Mesic Northern Forest",
          south:
            "Mesic Southern Forest"
        },


      /*
       * These are strongly associated with mesic northern
       * forest.
       */

      "BEECH-SUGAR MAPLE-HEMLOCK FOREST":
        {
          fixed:
            "Mesic Northern Forest"
        },


      "SUGAR MAPLE-HEMLOCK FOREST":
        {
          fixed:
            "Mesic Northern Forest"
        },


      "SUGAR MAPLE-YELLOW BIRCH FOREST":
        {
          fixed:
            "Mesic Northern Forest"
        },


      "HEMLOCK-YELLOW BIRCH FOREST":
        {
          fixed:
            "Mesic Northern Forest"
        },


      "HEMLOCK-WHITE PINE FOREST":
        {
          fixed:
            "Mesic Northern Forest"
        },


      "WHITE PINE-MIXED HARDWOOD FOREST":
        {
          fixed:
            "Mesic Northern Forest"
        },


      /*
       * White pine / oak systems are better treated as
       * dry-mesic northern forest in this simplified
       * crosswalk.
       */

      "WHITE PINE-WHITE OAK FOREST":
        {
          fixed:
            "Dry-mesic Northern Forest"
        },


      "WHITE PINE-RED PINE FOREST":
        {
          fixed:
            "Dry-mesic Northern Forest"
        },


      "MIXED PINE-OAK FOREST":
        {
          fixed:
            "Dry-mesic Northern Forest"
        },


      /*
       * Pine systems
       */

      "JACK PINE-RED PINE FOREST":
        {
          fixed:
            "Dry Northern Forest"
        },


      "PINE BARRENS":
        {
          fixed:
            "Pine Barrens"
        },


      /*
       * Oak systems
       *
       * Oak-Hickory and Mixed Oak are divided according to
       * the same temporary straight-line tension-zone concept.
       *
       * North:
       *     Dry-mesic Northern Forest
       *
       * South:
       *     Dry-mesic Southern Forest
       */

      "OAK-HICKORY FOREST":
        {
          tensionZone: true,
          north:
            "Dry-mesic Northern Forest",
          south:
            "Dry-mesic Southern Forest"
        },


      "MIXED OAK FOREST":
        {
          tensionZone: true,
          north:
            "Dry-mesic Northern Forest",
          south:
            "Dry-mesic Southern Forest"
        },


      /*
       * Oak savanna/barrens.
       */

      "MIXED OAK SAVANNA":
        {
          tensionZone: true,
          north:
            "Oak-Pine Barrens",
          south:
            "Oak Barrens"
        },


      "OAK/PINE BARRENS":
        {
          fixed:
            "Oak-Pine Barrens"
        },


      /*
       * Wetland forest systems
       */

      "BLACK ASH SWAMP":
        {
          fixed:
            "Northern Hardwood Swamp"
        },


      "CEDAR SWAMP":
        {
          fixed:
            "Rich Conifer Swamp"
        },


      "MIXED CONIFER SWAMP":
        {
          fixed:
            "Rich Conifer Swamp"
        },


      /*
       * Spruce-fir-cedar is closest to the boreal/conifer
       * portion of the MNFI classification.
       */

      "SPRUCE-FIR-CEDAR FOREST":
        {
          fixed:
            "Boreal Forest"
        },


      /*
       * Aspen-birch is retained without an MNFI community
       * link because the circa-1800 cover class does not
       * correspond cleanly to a single MNFI natural community.
       */

      "ASPEN-BIRCH FOREST":
        {
          none:
            true
        },


      /*
       * These are not forest communities and therefore
       * intentionally do not receive forest-community links.
       */

      "EXPOSED BEDROCK":
        {
          none:
            true
        },

      "GRASSLAND":
        {
          none:
            true
        },

      "LAKE/RIVER":
        {
          none:
            true
        },

      "MUSKEG/BOG":
        {
          none:
            true
        },

      "SAND DUNE":
        {
          none:
            true
        },

      "SHRUB SWAMP/EMERGENT MARSH":
        {
          none:
            true
        },

      "WET PRAIRIE":
        {
          none:
            true
        }

    };


    /* ========================================================
       STATUS
       ======================================================== */

    function setStatus(message) {

      document.getElementById(
        "status"
      ).innerHTML = message;

    }


    /* ========================================================
       GPS ON / OFF TOGGLE
       ======================================================== */

    function toggleGPS() {

      if (watchID === null) {

        startGPS();

      }

      else {

        stopGPS();

      }

    }


    /* ========================================================
       STOP GPS
       ======================================================== */

    function stopGPS() {

      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

      }


      watchID =
        null;


      gpsHasCentered =
        false;


      previousGPSPosition =
        null;


      latestGPSData =
        null;


      gpsDetailsVisible =
        false;


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS OFF";


      gpsButton.classList.remove(
        "active"
      );


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsButton.classList.remove(
        "active"
      );


      if (gpsMarker) {

        map.removeLayer(
          gpsMarker
        );

        gpsMarker =
          null;

      }


      if (gpsAccuracyCircle) {

        map.removeLayer(
          gpsAccuracyCircle
        );

        gpsAccuracyCircle =
          null;

      }


      setStatus(
        "GPS OFF"
      );

    }


    /* ========================================================
       GPS DETAILS TOGGLE
       ======================================================== */

    function toggleGPSDetails() {

      gpsDetailsVisible =
        !gpsDetailsVisible;

      const button =
        document.getElementById(
          "gpsDetailsButton"
        );


      if (gpsDetailsVisible) {

        button.innerHTML =
          "Hide GPS Details";

        button.classList.add(
          "active"
        );

        displayGPSDetails();

      }

      else {

        button.innerHTML =
          "GPS Details";

        button.classList.remove(
          "active"
        );

        displayGPSSummary();

      }

    }


    /* ========================================================
       DISPLAY GPS SUMMARY
       ======================================================== */

    function displayGPSSummary() {

      if (!latestGPSData) {

        setStatus(
          "GPS OFF"
        );

        return;

      }


      const stateText =
        latestGPSData.state ||
        "Outside Michigan historical coverage";


      setStatus(

        "GPS active<br>" +

        "Historical dataset: " +

        stateText

      );

    }


    /* ========================================================
       DISPLAY GPS DETAILS
       ======================================================== */

    function displayGPSDetails() {

      if (!latestGPSData) {

        return;

      }


      const data =
        latestGPSData;


      const stateText =
        data.state ||
        "Outside Michigan historical coverage";


      setStatus(

        "GPS active<br>" +

        "Latitude: " +
        data.latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +
        data.longitude.toFixed(6) +

        "<br>" +

        "Accuracy: approximately " +
        Math.round(data.accuracy) +
        " meters" +

        "<br>" +

        "Historical dataset: " +
        stateText

      );

    }


    /* ========================================================
       DETERMINE MICHIGAN COVERAGE
       ======================================================== */

    function getHistoricalState(
      latitude,
      longitude
    ) {

      const inMichigan =

        (
          longitude >= -90.5 &&
          longitude <= -82.0 &&
          latitude >= 41.5 &&
          latitude <= 49.0
        );


      if (inMichigan) {

        return "Michigan";

      }


      return null;

    }


    /* ========================================================
       GET COMMUNITY FOR A POLYGON
       ======================================================== */

    function getMNFICommunity(

      coverType,
      latitude

    ) {

      if (!coverType) {

        return null;

      }


      const key =
        String(coverType)
          .trim()
          .toUpperCase();


      const entry =
        MICHIGAN_COMMUNITY_MAP[key];


      if (!entry) {

        return null;

      }


      /*
       * Explicitly no community mapping.
       */

      if (entry.none) {

        return null;

      }


      /*
       * Location-dependent community.
       */

      if (entry.tensionZone) {

        if (
          latitude >=
          TENSION_ZONE_LATITUDE
        ) {

          return {

            name:
              entry.north,

            url:
              MNFI_COMMUNITIES[
                entry.north
                  .toLowerCase()
              ],

            region:
              "North of the approximate tension zone"

          };

        }

        else {

          return {

            name:
              entry.south,

            url:
              MNFI_COMMUNITIES[
                entry.south
                  .toLowerCase()
              ],

            region:
              "South of the approximate tension zone"

          };

        }

      }


      /*
       * Fixed community.
       */

      if (entry.fixed) {

        return {

          name:
            entry.fixed,

          url:
            MNFI_COMMUNITIES[
              entry.fixed
                .toLowerCase()
            ],

          region:
            null

        };

      }


      return null;

    }


    /* ========================================================
       FORMAT MNFI LINK
       ======================================================== */

    function createMNFILink(

      community

    ) {

      if (
        !community ||
        !community.url
      ) {

        return "";

      }


      let html =

        "<a " +

        "class='mnfiLink' " +

        "href='" +
        community.url +
        "' " +

        "target='_blank' " +

        "rel='noopener noreferrer'>" +

        "View MNFI community profile →" +

        "</a>";


      if (community.region) {

        html +=

          "<div class='tensionNote'>" +

          community.region +

          " (" +

          TENSION_ZONE_LATITUDE +

          "° N temporary straight-line boundary)" +

          "</div>";

      }


      return html;

    }


    /* ========================================================
       CALCULATE POLYGON CENTER
       ======================================================== */

    function getFeatureCenter(

      layer

    ) {

      try {

        const center =
          layer
            .getBounds()
            .getCenter();


        return center;

      }

      catch(error) {

        return null;

      }

    }


    /* ========================================================
       START GPS
       ======================================================== */

    function startGPS() {

      if (!navigator.geolocation) {

        setStatus(
          "GPS is not supported by this device."
        );

        return;

      }


      gpsHasCentered =
        false;

      lastMapCenterTime =
        0;

      lastVegetationCenter =
        null;

      previousGPSPosition =
        null;

      lastVegetationPosition =
        null;


      gpsDetailsVisible =
        false;

      latestGPSData =
        null;


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS ON";


      gpsButton.classList.add(
        "active"
      );


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsButton.innerHTML =
        "GPS Details";


      gpsDetailsButton.classList.remove(
        "active"
      );


      setStatus(
        "Waiting for GPS location..."
      );


      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

      }


      watchID =
        navigator.geolocation.watchPosition(

          function(position) {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            const gpsLatLng =
              [
                latitude,
                longitude
              ];


            /* ----------------------------------------------
               GPS MARKER
               ---------------------------------------------- */

            if (!gpsMarker) {

              gpsMarker =
                L.circleMarker(

                  gpsLatLng,

                  {

                    radius: 9,

                    color: "white",

                    weight: 3,

                    fillColor: "#0077ff",

                    fillOpacity: 1

                  }

                ).addTo(map);

            }

            else {

              gpsMarker.setLatLng(
                gpsLatLng
              );

            }


            /* ----------------------------------------------
               ACCURACY CIRCLE
               ---------------------------------------------- */

            if (!gpsAccuracyCircle) {

              gpsAccuracyCircle =
                L.circle(

                  gpsLatLng,

                  {

                    radius: accuracy,

                    color: "#0077ff",

                    fillOpacity: 0.08,

                    weight: 1

                  }

                ).addTo(map);

            }

            else {

              gpsAccuracyCircle.setLatLng(
                gpsLatLng
              );

              gpsAccuracyCircle.setRadius(
                accuracy
              );

            }


            /* ----------------------------------------------
               KEEP GPS DOT CENTERED
               ---------------------------------------------- */

            const now =
              Date.now();


            if (!gpsHasCentered) {

              map.setView(

                gpsLatLng,

                15,

                {
                  animate: false
                }

              );


              gpsHasCentered =
                true;

              lastMapCenterTime =
                now;


              if (vegetationVisible) {

                loadVegetation();

              }

            }

            else if (

              now -
              lastMapCenterTime >=
              gpsCenterInterval

            ) {

              map.setView(

                gpsLatLng,

                map.getZoom(),

                {
                  animate: false
                }

              );


              lastMapCenterTime =
                now;

            }


            /* ----------------------------------------------
               DETERMINE STATE
               ---------------------------------------------- */

            const state =
              getHistoricalState(

                latitude,
                longitude

              );


            lastState =
              state;


            /* ----------------------------------------------
               STORE GPS INFORMATION
               ---------------------------------------------- */

            latestGPSData = {

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              state:
                state

            };


            gpsDetailsButton.style.display =
              "inline-block";


            /* ----------------------------------------------
               STATUS
               ---------------------------------------------- */

            if (gpsDetailsVisible) {

              displayGPSDetails();

            }

            else {

              displayGPSSummary();

            }


            /* ----------------------------------------------
               CURRENT VEGETATION
               ---------------------------------------------- */

            if (currentVegetationVisible) {

              updateCurrentVegetation(

                latitude,
                longitude

              );

            }

          },


          function(error) {

            setStatus(

              "GPS error: " +
              error.message

            );

          },


          {

            enableHighAccuracy: true,

            maximumAge: 1000,

            timeout: 15000

          }

        );

    }


    /* ========================================================
       VEGETATION MAP TOGGLE
       ======================================================== */

    function toggleVegetation() {

      vegetationVisible =
        !vegetationVisible;


      const button =
        document.getElementById(
          "vegetationButton"
        );


      if (!vegetationVisible) {

        button.innerHTML =
          "Vegetation OFF";

        button.classList.remove(
          "active"
        );


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        setStatus(
          "Historical vegetation OFF"
        );


        return;

      }


      button.innerHTML =
        "Vegetation ON";

      button.classList.add(
        "active"
      );


      setStatus(
        "Loading historical vegetation..."
      );


      lastVegetationCenter =
        null;


      loadVegetation();

    }


    /* ========================================================
       LOAD VEGETATION MAP
       ======================================================== */

    async function loadVegetation() {

      if (map.getZoom() < 10) {

        setStatus(

          "Zoom in closer to load historical vegetation."

        );

        return;

      }


      const center =
        map.getCenter();


      const state =
        getHistoricalState(

          center.lat,
          center.lng

        );


      if (!state) {

        setStatus(

          "Move the map into Michigan to load historical vegetation."

        );

        return;

      }


      /*
       * Avoid unnecessarily querying the same area.
       */

      if (lastVegetationCenter) {

        const movedDistance =
          map.distance(

            lastVegetationCenter,
            center

          );


        if (movedDistance < 250) {

          return;

        }

      }


      lastVegetationCenter =
        center;


      const bounds =
        map.getBounds();


      const west =
        bounds.getWest();

      const south =
        bounds.getSouth();

      const east =
        bounds.getEast();

      const north =
        bounds.getNorth();


      const url =
        michiganURL;


      const outFields =
        "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME";


      /*
       * ArcGIS envelope.
       */

      const geometry =
        JSON.stringify({

          xmin:
            west,

          ymin:
            south,

          xmax:
            east,

          ymax:
            north,

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =
        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryEnvelope",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            outFields,

          returnGeometry:
            "true",

          outSR:
            "4326",

          f:
            "geojson"

        });


      try {

        const response =
          await fetch(

            url +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          setStatus(

            "No historical vegetation polygons were returned."

          );

          return;

        }


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        vegetationLayer =
          L.geoJSON(

            data,

            {

              style:
                function(feature) {

                  const p =
                    feature.properties;


                  const color =
                    getMichiganVegetationColor(

                      p.COVERTYPE

                    );


                  return {

                    color:
                      "#555555",

                    weight:
                      1,

                    fillColor:
                      color,

                    fillOpacity:
                      0.65

                  };

                },


              onEachFeature:
                function(
                  feature,
                  layer
                ) {

                  const p =
                    feature.properties;


                  const coverType =
                    p.COVERTYPE ||
                    "Unknown";


                  /*
                   * Use the actual clicked location
                   * when possible. This means a polygon
                   * crossing the temporary tension-zone
                   * line can resolve according to where
                   * the user clicks.
                   */

                  layer.on(

                    "click",

                    function(e) {

                      const clickLatitude =
                        e.latlng.lat;


                      const community =
                        getMNFICommunity(

                          coverType,

                          clickLatitude

                        );


                      let popup =

                        "<strong>" +

                        "Michigan Circa-1800 Vegetation" +

                        "</strong>" +

                        "<br><br>" +

                        "<strong>Historical cover type:</strong><br>" +

                        coverType +

                        "<br><br>" +

                        "<strong>Vegetation code:</strong> " +

                        (

                          p.VEGCODE ||
                          "Unknown"

                        ) +

                        "<br><br>" +

                        "<strong>County:</strong> " +

                        (

                          p.CNTY_NAME ||
                          "Unknown"

                        );


                      /*
                       * MNFI COMMUNITY
                       */

                      if (community) {

                        popup +=

                          "<br><br>" +

                          "<strong>MNFI natural community:</strong><br>" +

                          community.name +

                          createMNFILink(
                            community
                          );

                      }


                      else {

                        popup +=

                          "<br><br>" +

                          "<span style='color:#666'>" +

                          "No direct MNFI natural-community " +

                          "crosswalk assigned to this historical " +

                          "cover type." +

                          "</span>";

                      }


                      layer.bindPopup(

                        popup,

                        {

                          maxWidth:
                            300

                        }

                      ).openPopup(
                        e.latlng
                      );

                    }

                  );


                  layer.on(

                    "mouseover",

                    function(e) {

                      e.target.setStyle({

                        weight:
                          3,

                        color:
                          "#000000",

                        fillOpacity:
                          0.85

                      });

                    }

                  );


                  layer.on(

                    "mouseout",

                    function(e) {

                      if (
                        vegetationLayer
                      ) {

                        vegetationLayer.resetStyle(
                          e.target
                        );

                      }

                    }

                  );

                }

            }

          );


        vegetationLayer.addTo(
          map
        );


        setStatus(

          "Historical vegetation ON<br>" +

          "Michigan: " +

          data.features.length +

          " polygons loaded"

        );

      }


      catch(error) {

        console.error(
          "Vegetation loading error:",
          error
        );


        setStatus(

          "Vegetation error:<br>" +
          error.message

        );

      }

    }


    /* ========================================================
       CURRENT VEGETATION TOGGLE
       ======================================================== */

    function toggleCurrentVegetation() {

      currentVegetationVisible =
        !currentVegetationVisible;


      const button =
        document.getElementById(
          "currentButton"
        );


      const box =
        document.getElementById(
          "currentVegetation"
        );


      if (!currentVegetationVisible) {

        button.classList.remove(
          "active"
        );

        box.style.display =
          "none";

        return;

      }


      button.classList.add(
        "active"
      );


      box.style.display =
        "block";


      if (!gpsMarker) {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "Turn GPS on first";


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          "Your current location is needed to identify the historical vegetation.";

        return;

      }


      const position =
        gpsMarker.getLatLng();


      updateCurrentVegetation(

        position.lat,
        position.lng

      );

    }


    /* ========================================================
       UPDATE CURRENT VEGETATION
       ======================================================== */

    async function updateCurrentVegetation(

      latitude,
      longitude

    ) {

      const state =
        getHistoricalState(

          latitude,
          longitude

        );


      const positionKey =
        state +
        "|" +
        latitude.toFixed(5) +
        "," +
        longitude.toFixed(5);


      if (
        positionKey ===
        lastVegetationPosition
      ) {

        return;

      }


      lastVegetationPosition =
        positionKey;


      if (!state) {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "No historical dataset";


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          "The current GPS location is outside the Michigan historical vegetation dataset.";

        return;

      }


      const url =
        michiganURL;


      const outFields =
        "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME";


      /*
       * POINT QUERY
       */

      const geometry =
        JSON.stringify({

          x:
            longitude,

          y:
            latitude,

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =
        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryPoint",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            outFields,

          returnGeometry:
            "false",

          outSR:
            "4326",

          f:
            "json"

        });


      try {

        const response =
          await fetch(

            url +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          document.getElementById(
            "currentType"
          ).innerHTML =
            "No mapped historical vegetation";


          document.getElementById(
            "currentDetails"
          ).innerHTML =
            "No historical polygon was found at your GPS location.";

          return;

        }


        const properties =
          data.features[0].attributes;


        const coverType =
          properties.COVERTYPE ||
          "Unknown";


        const vegCode =
          properties.VEGCODE ||
          "Unknown";


        const county =
          properties.CNTY_NAME ||
          "Unknown";


        document.getElementById(
          "currentType"
        ).innerHTML =

          formatVegetationName(
            coverType
          );


        let details =

          "<strong>Michigan MNFI circa-1800</strong>" +

          "<br>" +

          "Vegetation code: " +
          vegCode +

          "<br>" +

          "County: " +
          county;


        /*
         * Add the MNFI community classification
         * to the current-location display too.
         */

        const community =
          getMNFICommunity(

            coverType,

            latitude

          );


        if (community) {

          details +=

            "<br><br>" +

            "<strong>MNFI natural community:</strong><br>" +

            community.name +

            "<br>" +

            "<a " +

            "class='mnfiLink' " +

            "href='" +
            community.url +
            "' " +

            "target='_blank' " +

            "rel='noopener noreferrer'>" +

            "View MNFI community profile →" +

            "</a>";


          if (community.region) {

            details +=

              "<div class='tensionNote'>" +

              community.region +

              " (" +

              TENSION_ZONE_LATITUDE +

              "° N temporary straight-line boundary)" +

              "</div>";

          }

        }


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          details;

      }


      catch(error) {

        console.error(

          "Current vegetation error:",
          error

        );


        document.getElementById(
          "currentType"
        ).innerHTML =
          "Unable to identify vegetation";


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          error.message;

      }

    }


    /* ========================================================
       FORMAT VEGETATION NAME
       ======================================================== */

    function formatVegetationName(
      name
    ) {

      if (!name) {

        return "Unknown";

      }


      return name
        .toLowerCase()
        .replace(
          /\b\w/g,
          function(letter) {

            return letter.toUpperCase();

          }
        );

    }

        "CEDAR SWAMP":
          "rgb(214,222,146)",

        "EXPOSED BEDROCK":

        "GRASSLAND":

        "HEMLOCK-WHITE PINE FOREST":

        "LAKE/RIVER":
          "rgb(242,222,148)",

        "MIXED CONIFER SWAMP":
          "rgb(242,217,143)",

        "MIXED HARDWOOD SWAMP":
          "rgb(242,213,141)",

        "MIXED OAK FOREST":
          "rgb(242,208,136)",

        "MIXED OAK SAVANNA":
          "rgb(240,201,134)",

        "MIXED PINE-OAK FOREST":
          "rgb(232,190,132)",

        "MUSKEG/BOG":
          "rgb(227,181,132)",

        "OAK-HICKORY FOREST":

        "SPRUCE-FIR-CEDAR FOREST":

        "SUGAR MAPLE-BASSWOOD FOREST":

        "SUGAR MAPLE-HEMLOCK FOREST":

        "SUGAR MAPLE-YELLOW BIRCH FOREST":

        "WET PRAIRIE":

      return (

    /* ========================================================
       RELOAD VEGETATION MAP WHEN MAP MOVES
       ======================================================== */

    let reloadTimer = null;


    map.on(

      "moveend",

      function() {

        if (!vegetationVisible) {

          return;

        }


        clearTimeout(
          reloadTimer
        );


        reloadTimer =
          setTimeout(

            function() {

              loadVegetation();

            },

            750

          );

      }

    );


  </script>
