<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Historical Vegetation Navigator</title>


  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body {

      height: 100%;
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

      overflow: hidden;

    }


    #map {

      height: 100%;
      width: 100%;

    }


    /* =====================================================
       COMPACT CONTROLS
       ===================================================== */

    #controls {

      position: absolute;

      top: 8px;
      left: 8px;

      right: auto;

      max-width: calc(100% - 16px);

      z-index: 1000;

      background: rgba(255,255,255,0.94);

      padding: 7px;

      border-radius: 7px;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.22);

      box-sizing: border-box;

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      font-size: 14px;

      padding: 7px 10px;

      margin-right: 4px;

      margin-bottom: 4px;

      border: none;

      border-radius: 6px;

      background: #2c6e49;

      color: white;

      line-height: 1.1;

    }


    button:active {

      background: #1f5035;

    }


    #gpsButton.active {

      background: #b33a3a;

    }


    #vegetationButton.active {

      background: #8b5a2b;

    }


    #currentButton.active {

      background: #245c9c;

    }


    /* =====================================================
       GPS DETAILS BUTTON
       ===================================================== */

    #gpsDetailsButton {

      display: none;

      background: #555;

      font-size: 12px;

      padding: 5px 8px;

      margin-top: 2px;

      margin-bottom: 3px;

    }


    #gpsDetailsButton.active {

      background: #333;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      margin-top: 3px;

      font-size: 12px;

      line-height: 1.25;

      max-width: 300px;

    }


    /* =====================================================
       CURRENT VEGETATION BOX
       ===================================================== */

    #currentVegetation {

      display: none;

      margin-top: 6px;

      padding: 7px;

      border-radius: 6px;

      background: rgba(243,243,243,0.95);

      border-left: 4px solid #2c6e49;

      max-width: 300px;

    }


    #currentTitle {

      font-size: 11px;

      font-weight: bold;

      color: #555;

      margin-bottom: 3px;

    }


    #currentType {

      font-size: 17px;

      font-weight: bold;

      line-height: 1.15;

    }


    #currentDetails {

      margin-top: 4px;

      font-size: 11px;

      line-height: 1.25;

      color: #555;

    }


    /* =====================================================
       MNFI LINKS
       ===================================================== */

    .mnfiLink {

      display: inline-block;

      margin-top: 7px;

      color: #245c9c;

      font-weight: bold;

      text-decoration: none;

    }


    .mnfiLink:hover {

      text-decoration: underline;

    }


    /* =====================================================
       SMALL SCREENS
       ===================================================== */

    @media (max-width: 500px) {

      #controls {

        top: 6px;
        left: 6px;

        padding: 6px;

        max-width: calc(100% - 12px);

      }


      button {

        font-size: 13px;

        padding: 6px 8px;

        margin-right: 3px;

        margin-bottom: 3px;

      }


      #gpsDetailsButton {

        font-size: 11px;

        padding: 5px 7px;

      }


      #status {

        font-size: 11px;

        line-height: 1.2;

        max-width: 280px;

      }


      #currentVegetation {

        max-width: 280px;

        padding: 6px;

        margin-top: 5px;

      }


      #currentTitle {

        font-size: 10px;

      }


      #currentType {

        font-size: 15px;

      }


      #currentDetails {

        font-size: 10px;

      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       CONTROLS
       ======================================================= -->

  <div id="controls">


    <button
      id="gpsButton"
      onclick="toggleGPS()"
    >

      GPS OFF

    </button>


    <button
      id="vegetationButton"
      onclick="toggleVegetation()"
    >

      Vegetation OFF

    </button>


    <button
      id="currentButton"
      onclick="toggleCurrentVegetation()"
    >

      Current Vegetation

    </button>


    <button
      id="gpsDetailsButton"
      onclick="toggleGPSDetails()"
    >

      GPS Details

    </button>


    <div id="status">

      GPS off

    </div>


    <!-- CURRENT VEGETATION DISPLAY -->

    <div id="currentVegetation">

      <div id="currentTitle">

        HISTORICAL VEGETATION AT YOUR LOCATION

      </div>


      <div id="currentType">

        Searching...

      </div>


      <div id="currentDetails">

      </div>


    </div>


  </div>


  <!-- MAP -->

  <div id="map"></div>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* ========================================================
       MAP
       ======================================================== */

    const map = L.map("map").setView(

      [44.5, -84.5],

      7

    );


    /* ========================================================
       BASEMAP
       ======================================================== */

    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }

    ).addTo(map);


    /* ========================================================
       MNFI SOURCE
       ======================================================== */

    const mnfiVegetationURL =

      "https://mnfi.anr.msu.edu/resources/vegetation-circa-1800";


    /* ========================================================
       MICHIGAN VEGETATION SERVICE
       ======================================================== */

    const michiganURL =

      "https://gisp.mcgi.state.mi.us/arcgis/rest/services/EGLE/LandCoverType_1800/FeatureServer/0";


    /* ========================================================
       GPS VARIABLES
       ======================================================== */

    let gpsMarker = null;

    let gpsAccuracyCircle = null;

    let watchID = null;

    let gpsEnabled = false;

    let gpsHasCentered = false;

    let gpsDetailsVisible = false;

    let latestGPSData = null;

    let lastMapCenterTime = 0;

    const gpsCenterInterval = 500;


    /* ========================================================
       VEGETATION VARIABLES
       ======================================================== */

    let vegetationLayer = null;

    let vegetationVisible = false;

    let lastVegetationCenter = null;


    /* ========================================================
       CURRENT VEGETATION VARIABLES
       ======================================================== */

    let currentVegetationVisible = false;

    let lastVegetationPosition = null;

    let lastState = null;


    /* ========================================================
       STATUS
       ======================================================== */

    function setStatus(message) {

      document.getElementById(
        "status"
      ).innerHTML = message;

    }


    /* ========================================================
       GPS DETAILS TOGGLE
       ======================================================== */

    function toggleGPSDetails() {

      gpsDetailsVisible =
        !gpsDetailsVisible;


      const button =
        document.getElementById(
          "gpsDetailsButton"
        );


      if (gpsDetailsVisible) {

        button.innerHTML =
          "Hide GPS Details";

        button.classList.add(
          "active"
        );

        displayGPSDetails();

      }

      else {

        button.innerHTML =
          "GPS Details";

        button.classList.remove(
          "active"
        );

        displayGPSSummary();

      }

    }


    /* ========================================================
       DISPLAY GPS SUMMARY
       ======================================================== */

    function displayGPSSummary() {

      if (!latestGPSData) {

        setStatus(
          "GPS off"
        );

        return;

      }


      const stateText =
        latestGPSData.state ||
        "Outside historical coverage";


      setStatus(

        "GPS active<br>" +

        "Historical dataset: " +

        stateText

      );

    }


    /* ========================================================
       DISPLAY GPS DETAILS
       ======================================================== */

    function displayGPSDetails() {

      if (!latestGPSData) {

        return;

      }


      const data =
        latestGPSData;


      const stateText =
        data.state ||
        "Outside historical coverage";


      setStatus(

        "GPS active<br>" +

        "Latitude: " +
        data.latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +
        data.longitude.toFixed(6) +

        "<br>" +

        "Accuracy: approximately " +
        Math.round(data.accuracy) +
        " meters" +

        "<br>" +

        "Historical dataset: " +
        stateText

      );

    }


    /* ========================================================
       DETERMINE IF LOCATION IS IN MICHIGAN
       ======================================================== */

    function getHistoricalState(
      latitude,
      longitude
    ) {

      const inMichigan =

        (
          longitude >= -90.5 &&
          longitude <= -82.0 &&
          latitude >= 41.5 &&
          latitude <= 49.0
        );


      if (inMichigan) {

        return "Michigan";

      }


      return null;

    }


    /* ========================================================
       STOP GPS
       ======================================================== */

    function stopGPS() {

      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

        watchID = null;

      }


      gpsEnabled =
        false;


      gpsHasCentered =
        false;


      latestGPSData =
        null;


      lastVegetationPosition =
        null;


      lastState =
        null;


      if (gpsMarker) {

        map.removeLayer(
          gpsMarker
        );

        gpsMarker =
          null;

      }


      if (gpsAccuracyCircle) {

        map.removeLayer(
          gpsAccuracyCircle
        );

        gpsAccuracyCircle =
          null;

      }


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS OFF";


      gpsButton.classList.remove(
        "active"
      );


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsVisible =
        false;


      gpsDetailsButton.innerHTML =
        "GPS Details";


      gpsDetailsButton.classList.remove(
        "active"
      );


      setStatus(
        "GPS off"
      );

    }


    /* ========================================================
       GPS TOGGLE
       ======================================================== */

    function toggleGPS() {

      if (gpsEnabled) {

        stopGPS();

        return;

      }


      startGPS();

    }


    /* ========================================================
       START GPS
       ======================================================== */

    function startGPS() {

      if (!navigator.geolocation) {

        setStatus(
          "GPS is not supported by this device."
        );

        return;

      }


      gpsEnabled =
        true;


      gpsHasCentered =
        false;


      lastMapCenterTime =
        0;


      lastVegetationCenter =
        null;


      lastVegetationPosition =
        null;


      latestGPSData =
        null;


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS ON";


      gpsButton.classList.add(
        "active"
      );


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsVisible =
        false;


      gpsDetailsButton.innerHTML =
        "GPS Details";


      gpsDetailsButton.classList.remove(
        "active"
      );


      setStatus(
        "Waiting for GPS location..."
      );


      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

      }


      watchID =
        navigator.geolocation.watchPosition(

          function(position) {

            /*
             * If the user switched GPS off while a
             * position was being processed, ignore it.
             */

            if (!gpsEnabled) {

              return;

            }


            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            const gpsLatLng =
              [
                latitude,
                longitude
              ];


            /* ----------------------------------------------
               GPS MARKER
               ---------------------------------------------- */

            if (!gpsMarker) {

              gpsMarker =
                L.circleMarker(

                  gpsLatLng,

                  {

                    radius: 9,

                    color: "white",

                    weight: 3,

                    fillColor: "#0077ff",

                    fillOpacity: 1

                  }

                ).addTo(map);

            }

            else {

              gpsMarker.setLatLng(
                gpsLatLng
              );

            }


            /* ----------------------------------------------
               ACCURACY CIRCLE
               ---------------------------------------------- */

            if (!gpsAccuracyCircle) {

              gpsAccuracyCircle =
                L.circle(

                  gpsLatLng,

                  {

                    radius: accuracy,

                    color: "#0077ff",

                    fillOpacity: 0.08,

                    weight: 1

                  }

                ).addTo(map);

            }

            else {

              gpsAccuracyCircle.setLatLng(
                gpsLatLng
              );

              gpsAccuracyCircle.setRadius(
                accuracy
              );

            }


            /* ----------------------------------------------
               KEEP GPS DOT CENTERED
               ---------------------------------------------- */

            const now =
              Date.now();


            if (!gpsHasCentered) {

              map.setView(

                gpsLatLng,

                15,

                {
                  animate: false
                }

              );


              gpsHasCentered =
                true;

              lastMapCenterTime =
                now;


              if (vegetationVisible) {

                loadVegetation();

              }

            }

            else if (

              now -
              lastMapCenterTime >=
              gpsCenterInterval

            ) {

              map.setView(

                gpsLatLng,

                map.getZoom(),

                {
                  animate: false
                }

              );


              lastMapCenterTime =
                now;

            }


            /* ----------------------------------------------
               DETERMINE STATE
               ---------------------------------------------- */

            const state =
              getHistoricalState(

                latitude,
                longitude

              );


            lastState =
              state;


            /* ----------------------------------------------
               STORE GPS INFORMATION
               ---------------------------------------------- */

            latestGPSData = {

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              state:
                state

            };


            const gpsDetailsButton =
              document.getElementById(
                "gpsDetailsButton"
              );


            gpsDetailsButton.style.display =
              "inline-block";


            /* ----------------------------------------------
               STATUS
               ---------------------------------------------- */

            if (gpsDetailsVisible) {

              displayGPSDetails();

            }

            else {

              displayGPSSummary();

            }


            /* ----------------------------------------------
               CURRENT VEGETATION
               ---------------------------------------------- */

            if (currentVegetationVisible) {

              updateCurrentVegetation(

                latitude,
                longitude

              );

            }

          },


          function(error) {

            if (!gpsEnabled) {

              return;

            }


            setStatus(

              "GPS error: " +
              error.message

            );

          },


          {

            enableHighAccuracy: true,

            maximumAge: 1000,

            timeout: 15000

          }

        );

    }


    /* ========================================================
       VEGETATION MAP TOGGLE
       ======================================================== */

    function toggleVegetation() {

      vegetationVisible =
        !vegetationVisible;


      const button =
        document.getElementById(
          "vegetationButton"
        );


      if (!vegetationVisible) {

        button.innerHTML =
          "Vegetation OFF";

        button.classList.remove(
          "active"
        );


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        setStatus(
          "Historical vegetation OFF"
        );


        return;

      }


      button.innerHTML =
        "Vegetation ON";

      button.classList.add(
        "active"
      );


      setStatus(
        "Loading historical vegetation..."
      );


      lastVegetationCenter =
        null;


      loadVegetation();

    }


    /* ========================================================
       LOAD VEGETATION MAP
       ======================================================== */

    async function loadVegetation() {

      if (map.getZoom() < 10) {

        setStatus(

          "Zoom in closer to load historical vegetation."

        );

        return;

      }


      const center =
        map.getCenter();


      const state =
        getHistoricalState(

          center.lat,
          center.lng

        );


      if (state !== "Michigan") {

        setStatus(

          "Move the map into Michigan to load historical vegetation."

        );

        return;

      }


      /*
       * Avoid unnecessarily querying the same area.
       */

      if (lastVegetationCenter) {

        const movedDistance =
          map.distance(

            lastVegetationCenter,
            center

          );


        if (movedDistance < 250) {

          return;

        }

      }


      lastVegetationCenter =
        center;


      const bounds =
        map.getBounds();


      const west =
        bounds.getWest();

      const south =
        bounds.getSouth();

      const east =
        bounds.getEast();

      const north =
        bounds.getNorth();


      const outFields =
        "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME";


      /*
       * ArcGIS envelope.
       */

      const geometry =
        JSON.stringify({

          xmin:
            west,

          ymin:
            south,

          xmax:
            east,

          ymax:
            north,

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =
        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryEnvelope",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            outFields,

          returnGeometry:
            "true",

          outSR:
            "4326",

          f:
            "geojson"

        });


      try {

        const response =
          await fetch(

            michiganURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          setStatus(

            "No historical vegetation polygons were returned."

          );

          return;

        }


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        vegetationLayer =
          L.geoJSON(

            data,

            {

              style:
                function(feature) {

                  const p =
                    feature.properties;


                  const color =
                    getMichiganVegetationColor(

                      p.COVERTYPE

                    );


                  return {

                    color:
                      "#555555",

                    weight:
                      1,

                    fillColor:
                      color,

                    fillOpacity:
                      0.65

                  };

                },


              onEachFeature:
                function(
                  feature,
                  layer
                ) {

                  const p =
                    feature.properties;


                  const coverType =
                    p.COVERTYPE ||
                    "Unknown";


                  const formattedName =
                    formatVegetationName(
                      coverType
                    );


                  const popup =

                    "<strong>" +

                    "Michigan Circa-1800 Vegetation" +

                    "</strong>" +

                    "<br><br>" +

                    "<strong>Historical cover type:</strong><br>" +

                    formattedName +

                    "<br><br>" +

                    "<strong>Vegetation code:</strong> " +

                    (
                      p.VEGCODE ||
                      "Unknown"
                    ) +

                    "<br><br>" +

                    "<strong>County:</strong> " +

                    (
                      p.CNTY_NAME ||
                      "Unknown"
                    ) +

                    "<br>" +

                    "<a class='mnfiLink' " +

                    "href='" +
                    mnfiVegetationURL +
                    "' " +

                    "target='_blank' " +

                    "rel='noopener noreferrer'>" +

                    "View MNFI Vegetation circa 1800 ↗" +

                    "</a>";


                  layer.bindPopup(
                    popup
                  );


                  layer.on(

                    "mouseover",

                    function(e) {

                      e.target.setStyle({

                        weight:
                          3,

                        color:
                          "#000000",

                        fillOpacity:
                          0.85

                      });

                    }

                  );


                  layer.on(

                    "mouseout",

                    function(e) {

                      if (
                        vegetationLayer
                      ) {

                        vegetationLayer.resetStyle(
                          e.target
                        );

                      }

                    }

                  );

                }

            }

          );


        vegetationLayer.addTo(
          map
        );


        setStatus(

          "Historical vegetation ON<br>" +

          "Michigan: " +

          data.features.length +

          " polygons loaded"

        );

      }


      catch(error) {

        console.error(
          "Vegetation loading error:",
          error
        );


        setStatus(

          "Vegetation error:<br>" +
          error.message

        );

      }

    }


    /* ========================================================
       CURRENT VEGETATION TOGGLE
       ======================================================== */

    function toggleCurrentVegetation() {

      currentVegetationVisible =
        !currentVegetationVisible;


      const button =
        document.getElementById(
          "currentButton"
        );


      const box =
        document.getElementById(
          "currentVegetation"
        );


      if (!currentVegetationVisible) {

        button.classList.remove(
          "active"
        );

        box.style.display =
          "none";

        return;

      }


      button.classList.add(
        "active"
      );


      box.style.display =
        "block";


      if (!gpsMarker) {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "Turn GPS on first";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "Your current location is needed to identify the historical vegetation.";

        return;

      }


      const position =
        gpsMarker.getLatLng();


      updateCurrentVegetation(

        position.lat,
        position.lng

      );

    }


    /* ========================================================
       UPDATE CURRENT VEGETATION
       ======================================================== */

    async function updateCurrentVegetation(

      latitude,
      longitude

    ) {

      if (!gpsEnabled) {

        return;

      }


      const state =
        getHistoricalState(

          latitude,
          longitude

        );


      const positionKey =
        state +
        "|" +
        latitude.toFixed(5) +
        "," +
        longitude.toFixed(5);


      if (
        positionKey ===
        lastVegetationPosition
      ) {

        return;

      }


      lastVegetationPosition =
        positionKey;


      if (state !== "Michigan") {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "Outside Michigan";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "The current GPS location is outside the Michigan historical vegetation dataset.";

        return;

      }


      const outFields =
        "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME";


      /*
       * POINT QUERY
       */

      const geometry =
        JSON.stringify({

          x:
            longitude,

          y:
            latitude,

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =
        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryPoint",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            outFields,

          returnGeometry:
            "false",

          outSR:
            "4326",

          f:
            "json"

        });


      try {

        const response =
          await fetch(

            michiganURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          document.getElementById(
            "currentType"
          ).innerHTML =
            "No mapped historical vegetation";


          document.getElementById(
            "currentDetails"
          ).innerHTML =

            "No historical polygon was found at your GPS location.";

          return;

        }


        const properties =
          data.features[0].attributes;


        const coverType =
          properties.COVERTYPE ||
          "Unknown";


        const vegCode =
          properties.VEGCODE ||
          "Unknown";


        const county =
          properties.CNTY_NAME ||
          "Unknown";


        const formattedName =
          formatVegetationName(
            coverType
          );


        document.getElementById(
          "currentType"
        ).innerHTML =

          formattedName;


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "<strong>Michigan MNFI circa-1800</strong>" +

          "<br>" +

          "Vegetation code: " +
          vegCode +

          "<br>" +

          "County: " +
          county +

          "<br>" +

          "<a class='mnfiLink' " +

          "href='" +
          mnfiVegetationURL +
          "' " +

          "target='_blank' " +

          "rel='noopener noreferrer'>" +

          "View MNFI Vegetation circa 1800 ↗" +

          "</a>";

      }


      catch(error) {

        console.error(

          "Current vegetation error:",
          error

        );


        document.getElementById(
          "currentType"
        ).innerHTML =
          "Unable to identify vegetation";


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          error.message;

      }

    }


    /* ========================================================
       FORMAT VEGETATION NAME
       ======================================================== */

    function formatVegetationName(
      name
    ) {

      if (!name) {

        return "Unknown";

      }


      return name
        .toLowerCase()
        .replace(
          /\b\w/g,
          function(letter) {

            return letter.toUpperCase();

          }
        );

    }

    /* ========================================================
       RELOAD VEGETATION MAP WHEN MAP MOVES
       ======================================================== */

    let reloadTimer = null;


    map.on(

      "moveend",

      function() {

        if (!vegetationVisible) {

          return;

        }


        clearTimeout(
          reloadTimer
        );


        reloadTimer =
          setTimeout(

            function() {

              loadVegetation();

            },

            750

          );

      }
