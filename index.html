<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Historical Vegetation Navigator</title>


  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body {

      height: 100%;
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

      overflow: hidden;

    }


    #map {

      height: 100%;
      width: 100%;

    }


    /* =====================================================
       CONTROLS
       ===================================================== */

    #controls {

      position: absolute;

      top: 8px;
      left: 8px;

      right: auto;

      max-width: calc(100% - 16px);

      z-index: 1000;

      background: rgba(255,255,255,0.94);

      padding: 7px;

      border-radius: 7px;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.22);

      box-sizing: border-box;

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      font-size: 14px;

      padding: 7px 10px;

      margin-right: 4px;

      margin-bottom: 4px;

      border: none;

      border-radius: 6px;

      background: #2c6e49;

      color: white;

      line-height: 1.1;

    }


    button:active {

      background: #1f5035;

    }


    #gpsButton.active {

      background: #245c9c;

    }


    #vegetationButton.active {

      background: #8b5a2b;

    }


    #currentButton.active {

      background: #245c9c;

    }


    /* =====================================================
       GPS DETAILS BUTTON
       ===================================================== */

    #gpsDetailsButton {

      display: none;

      background: #555;

      font-size: 12px;

      padding: 5px 8px;

      margin-top: 2px;

      margin-bottom: 3px;

    }


    #gpsDetailsButton.active {

      background: #333;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      margin-top: 3px;

      font-size: 12px;

      line-height: 1.25;

      max-width: 300px;

    }


    /* =====================================================
       CURRENT VEGETATION BOX
       ===================================================== */

    #currentVegetation {

      display: none;

      margin-top: 6px;

      padding: 7px;

      border-radius: 6px;

      background: rgba(243,243,243,0.95);

      border-left: 4px solid #2c6e49;

      max-width: 300px;

    }


    #currentTitle {

      font-size: 11px;

      font-weight: bold;

      color: #555;

      margin-bottom: 3px;

    }


    #currentType {

      font-size: 17px;

      font-weight: bold;

      line-height: 1.15;

    }


    #currentDetails {

      margin-top: 4px;

      font-size: 11px;

      line-height: 1.25;

      color: #555;

    }


    /* =====================================================
       MNFI COMMUNITY LINK
       ===================================================== */

    .mnfi-link {

      display: inline-block;

      margin-top: 8px;

      padding: 6px 9px;

      border-radius: 5px;

      background: #2c6e49;

      color: white !important;

      text-decoration: none;

      font-weight: bold;

      font-size: 12px;

    }


    .mnfi-link:hover {

      background: #1f5035;

    }


    /* =====================================================
       TENSION ZONE NOTE
       ===================================================== */

    .tension-note {

      margin-top: 6px;

      padding-top: 5px;

      border-top: 1px solid #ddd;

      color: #666;

      font-size: 10px;

      line-height: 1.25;

    }


    /* =====================================================
       SMALL SCREENS
       ===================================================== */

    @media (max-width: 500px) {

      #controls {

        top: 6px;
        left: 6px;

        padding: 6px;

        max-width: calc(100% - 12px);

      }


      button {

        font-size: 13px;

        padding: 6px 8px;

        margin-right: 3px;

        margin-bottom: 3px;

      }


      #gpsDetailsButton {

        font-size: 11px;

        padding: 5px 7px;

      }


      #status {

        font-size: 11px;

        line-height: 1.2;

        max-width: 280px;

      }


      #currentVegetation {

        max-width: 280px;

        padding: 6px;

        margin-top: 5px;

      }


      #currentTitle {

        font-size: 10px;

      }


      #currentType {

        font-size: 15px;

      }


      #currentDetails {

        font-size: 10px;

      }


      .mnfi-link {

        font-size: 11px;

        padding: 5px 8px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       CONTROLS
       ===================================================== -->

  <div id="controls">


    <button
      id="gpsButton"
      onclick="toggleGPS()"
    >

      GPS OFF

    </button>


    <button
      id="vegetationButton"
      onclick="toggleVegetation()"
    >

      Vegetation OFF

    </button>


    <button
      id="currentButton"
      onclick="toggleCurrentVegetation()"
    >

      Current Vegetation

    </button>


    <button
      id="gpsDetailsButton"
      onclick="toggleGPSDetails()"
    >

      GPS Details

    </button>


    <div id="status">

      GPS off

    </div>


    <!-- CURRENT VEGETATION DISPLAY -->

    <div id="currentVegetation">

      <div id="currentTitle">

        HISTORICAL VEGETATION AT YOUR LOCATION

      </div>


      <div id="currentType">

        Searching...

      </div>


      <div id="currentDetails">

      </div>

    </div>


  </div>


  <!-- =====================================================
       MAP
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* =====================================================
       MAP
       ===================================================== */

    const map =
      L.map("map").setView(

        [44.5, -84.5],

        7

      );


    /* =====================================================
       BASEMAP
       ===================================================== */

    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }

    ).addTo(map);


    /* =====================================================
       GPS VARIABLES
       ===================================================== */

    let gpsMarker = null;

    let gpsAccuracyCircle = null;

    let watchID = null;

    let gpsEnabled = false;

    let gpsHasCentered = false;

    let gpsDetailsVisible = false;

    let latestGPSData = null;

    let lastMapCenterTime = 0;

    const gpsCenterInterval = 500;


    /*
     * IMPORTANT:
     *
     * When the user touches a vegetation polygon,
     * automatic GPS recentering is temporarily suspended.
     *
     * This prevents map.setView() from immediately
     * closing the Leaflet popup.
     */

    let userInteractingWithMap = false;

    let popupInteractionTimer = null;


    /*
     * How long automatic GPS following remains paused
     * after a polygon interaction.
     */

    const popupPauseDuration = 3000;


    /* =====================================================
       VEGETATION VARIABLES
       ===================================================== */

    let vegetationLayer = null;

    let vegetationVisible = false;

    let lastVegetationCenter = null;


    /* =====================================================
       CURRENT VEGETATION VARIABLES
       ===================================================== */

    let currentVegetationVisible = false;

    let lastVegetationPosition = null;

    let lastState = null;


    /* =====================================================
       MICHIGAN MNFI CIRCA-1800 SERVICE
       ===================================================== */

    const michiganURL =

      "https://gisp.mcgi.state.mi.us/arcgis/rest/services/EGLE/LandCoverType_1800/FeatureServer/0";


    /* =====================================================
       STATUS
       ===================================================== */

    function setStatus(message) {

      document.getElementById(
        "status"
      ).innerHTML = message;

    }


    /* =====================================================
       PAUSE AUTOMATIC GPS CENTERING
       ===================================================== */

    function pauseGPSAutoCentering() {

      userInteractingWithMap = true;


      clearTimeout(
        popupInteractionTimer
      );


      popupInteractionTimer =

        setTimeout(

          function() {

            userInteractingWithMap = false;

          },

          popupPauseDuration

        );

    }


    /* =====================================================
       GPS DETAILS TOGGLE
       ===================================================== */

    function toggleGPSDetails() {

      gpsDetailsVisible =
        !gpsDetailsVisible;


      const button =
        document.getElementById(
          "gpsDetailsButton"
        );


      if (gpsDetailsVisible) {

        button.innerHTML =
          "Hide GPS Details";

        button.classList.add(
          "active"
        );

        displayGPSDetails();

      }

      else {

        button.innerHTML =
          "GPS Details";

        button.classList.remove(
          "active"
        );

        displayGPSSummary();

      }

    }


    /* =====================================================
       DISPLAY GPS SUMMARY
       ===================================================== */

    function displayGPSSummary() {

      if (!latestGPSData) {

        setStatus(
          "GPS off"
        );

        return;

      }


      const stateText =
        latestGPSData.state ||
        "Outside current historical coverage";


      setStatus(

        "GPS active<br>" +

        "Historical dataset: " +

        stateText

      );

    }


    /* =====================================================
       DISPLAY GPS DETAILS
       ===================================================== */

    function displayGPSDetails() {

      if (!latestGPSData) {

        return;

      }


      const data =
        latestGPSData;


      const stateText =
        data.state ||
        "Outside current historical coverage";


      setStatus(

        "GPS active<br>" +

        "Latitude: " +
        data.latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +
        data.longitude.toFixed(6) +

        "<br>" +

        "Accuracy: approximately " +
        Math.round(data.accuracy) +
        " meters" +

        "<br>" +

        "Historical dataset: " +
        stateText

      );

    }


    /* =====================================================
       DETERMINE MICHIGAN COVERAGE
       ===================================================== */

    function getHistoricalState(

      latitude,
      longitude

    ) {

      const inMichigan =

        (

          longitude >= -90.5 &&

          longitude <= -82.0 &&

          latitude >= 41.5 &&

          latitude <= 49.0

        );


      if (inMichigan) {

        return "Michigan";

      }


      return null;

    }


    /* =====================================================
       FLORISTIC / CLIMATIC TENSION ZONE
       ===================================================== */

    /*
     * This is intentionally a SIMPLE STRAIGHT LINE
     * approximation for the current version.
     *
     * Points NORTH of this line are treated as
     * northern communities.
     *
     * Points SOUTH of this line are treated as
     * southern communities.
     *
     * The line is approximately:
     *
     *   43.55 N at -86.0 W
     *   43.10 N at -84.0 W
     *   42.75 N at -82.0 W
     *
     * This is NOT intended to represent the actual
     * ecological boundary at fine scale.
     */

    function tensionZoneLatitude(longitude) {

      /*
       * Straight-line interpolation.
       */

      const westLon =
        -86.0;

      const eastLon =
        -82.0;

      const westLat =
        43.55;

      const eastLat =
        42.75;


      const fraction =

        (
          longitude -
          westLon
        ) /

        (
          eastLon -
          westLon
        );


      return (

        westLat +

        fraction *
        (
          eastLat -
          westLat
        )

      );

    }


    function isSouthOfTensionZone(

      latitude,
      longitude

    ) {

      return (

        latitude <
        tensionZoneLatitude(
          longitude
        )

      );

    }


    /* =====================================================
       MNFI COMMUNITY PAGE LINKS
       ===================================================== */

    /*
     * These are MNFI's current natural-community
     * description pages.
     *
     * Some circa-1800 map cover types correspond
     * directly to a modern MNFI community.
     *
     * The tension-zone-sensitive communities are
     * handled separately below.
     */

    const mnfiCommunityURLs = {

      "mesic northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10687/mesic-northern-forest",

      "dry-mesic northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10688/dry-mesic-northern-forest",

      "dry-mesic southern forest":
        "https://mnfi.anr.msu.edu/communities/description/10685/dry-mesic-southern-forest",

      "mesic southern forest":
        "https://mnfi.anr.msu.edu/communities/description/10686/mesic-southern-forest"

    };


    /* =====================================================
       DETERMINE MNFI COMMUNITY
       ===================================================== */

    function getMNFICommunity(

      coverType,
      latitude,
      longitude

    ) {

      if (!coverType) {

        return null;

      }


      const type =

        String(coverType)
          .trim()
          .toUpperCase();


      const south =

        isSouthOfTensionZone(

          latitude,
          longitude

        );


      /*
       * ---------------------------------------------------
       * BEECH-SUGAR MAPLE FOREST
       * ---------------------------------------------------
       *
       * This is the most important tension-zone case.
       *
       * NORTH:
       * Mesic Northern Forest
       *
       * SOUTH:
       * Mesic Southern Forest
       */

      if (

        type ===
        "BEECH-SUGAR MAPLE FOREST"

      ) {

        if (south) {

          return {

            name:
              "Mesic Southern Forest",

            url:
              mnfiCommunityURLs[
                "mesic southern forest"
              ],

            tensionSensitive:
              true

          };

        }

        else {

          return {

            name:
              "Mesic Northern Forest",

            url:
              mnfiCommunityURLs[
                "mesic northern forest"
              ],

            tensionSensitive:
              true

          };

        }

      }


      /*
       * ---------------------------------------------------
       * BEECH-SUGAR MAPLE-HEMLOCK FOREST
       * ---------------------------------------------------
       *
       * Treated as northern mesic forest.
       */

      if (

        type ===
        "BEECH-SUGAR MAPLE-HEMLOCK FOREST"

      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * SUGAR MAPLE-BASSWOOD FOREST
       * ---------------------------------------------------
       *
       * Generally mapped to mesic northern forest
       * in this simplified community-linking system.
       */

      if (

        type ===
        "SUGAR MAPLE-BASSWOOD FOREST"

      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * SUGAR MAPLE-HEMLOCK FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "SUGAR MAPLE-HEMLOCK FOREST"

      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * SUGAR MAPLE-YELLOW BIRCH FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "SUGAR MAPLE-YELLOW BIRCH FOREST"

      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * OAK-HICKORY FOREST
       * ---------------------------------------------------
       *
       * For now this is linked to Dry-mesic Southern
       * Forest because the circa-1800 cover type is
       * most closely associated with the southern
       * oak-dominated forest community.
       */

      if (

        type ===
        "OAK-HICKORY FOREST"

      ) {

        return {

          name:
            "Dry-mesic Southern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic southern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * MIXED OAK FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "MIXED OAK FOREST"

      ) {

        return {

          name:
            south
              ? "Dry-mesic Southern Forest"
              : "Dry-mesic Northern Forest",

          url:
            south

              ? mnfiCommunityURLs[
                  "dry-mesic southern forest"
                ]

              : mnfiCommunityURLs[
                  "dry-mesic northern forest"
                ],

          tensionSensitive:
            true

        };

      }


      /*
       * ---------------------------------------------------
       * MIXED PINE-OAK FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "MIXED PINE-OAK FOREST"

      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * WHITE PINE-WHITE OAK FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "WHITE PINE-WHITE OAK FOREST"

      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * WHITE PINE-MIXED HARDWOOD FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "WHITE PINE-MIXED HARDWOOD FOREST"

      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * WHITE PINE-RED PINE FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "WHITE PINE-RED PINE FOREST"

      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * JACK PINE-RED PINE FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "JACK PINE-RED PINE FOREST"

      ) {

        return {

          name:
            "Dry Northern Forest",

          url:
            "https://mnfi.anr.msu.edu/communities/description/10684/dry-northern-forest",

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * HEMLOCK-WHITE PINE FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "HEMLOCK-WHITE PINE FOREST"

      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * HEMLOCK-YELLOW BIRCH FOREST
       * ---------------------------------------------------
       */

      if (

        type ===
        "HEMLOCK-YELLOW BIRCH FOREST"

      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      /*
       * ---------------------------------------------------
       * ASPEN-BIRCH FOREST
       * ---------------------------------------------------
       *
       * No direct community link is assigned here because
       * this circa-1800 cover type does not map cleanly to
       * one of the seven modern MNFI forest communities.
       */

      return null;

    }


    /* =====================================================
       CREATE MNFI LINK
       ===================================================== */

    function createMNFILink(

      coverType,
      latitude,
      longitude

    ) {

      const community =
        getMNFICommunity(

          coverType,
          latitude,
          longitude

        );


      if (!community) {

        return "";

      }


      let html =

        '<a class="mnfi-link" ' +

        'href="' +
        community.url +
        '" ' +

        'target="_blank" ' +

        'rel="noopener noreferrer">' +

        "View MNFI community page" +

        "</a>";


      /*
       * Tell the user when the straight-line
       * tension-zone rule affected the selection.
       */

      if (
        community.tensionSensitive
      ) {

        const sideText =

          isSouthOfTensionZone(
            latitude,
            longitude
          )

            ? "South of"
            : "North of";


        html +=

          '<div class="tension-note">' +

          "Community selected as " +

          "<strong>" +

          sideText +

          " the approximate floristic tension zone</strong> " +

          "using the current straight-line approximation." +

          "</div>";

      }


      return html;

    }


    /* =====================================================
       GPS TOGGLE
       ===================================================== */

    function toggleGPS() {

      if (gpsEnabled) {

        stopGPS();

      }

      else {

        startGPS();

      }

    }


    /* =====================================================
       START GPS
       ===================================================== */

    function startGPS() {

      if (!navigator.geolocation) {

        setStatus(
          "GPS is not supported by this device."
        );

        return;

      }


      gpsEnabled =
        true;


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS ON";

      gpsButton.classList.add(
        "active"
      );


      gpsHasCentered =
        false;

      lastMapCenterTime =
        0;

      lastVegetationCenter =
        null;

      lastVegetationPosition =
        null;

      latestGPSData =
        null;


      gpsDetailsVisible =
        false;


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsButton.innerHTML =
        "GPS Details";


      gpsDetailsButton.classList.remove(
        "active"
      );


      setStatus(
        "Waiting for GPS location..."
      );


      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

      }


      watchID =

        navigator.geolocation.watchPosition(

          function(position) {

            /*
             * If GPS has been turned off while a
             * callback was already queued, ignore it.
             */

            if (!gpsEnabled) {

              return;

            }


            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            const gpsLatLng =
              [
                latitude,
                longitude
              ];


            /* ---------------------------------------------
               GPS MARKER
               --------------------------------------------- */

            if (!gpsMarker) {

              gpsMarker =

                L.circleMarker(

                  gpsLatLng,

                  {

                    radius: 9,

                    color: "white",

                    weight: 3,

                    fillColor: "#0077ff",

                    fillOpacity: 1

                  }

                ).addTo(map);

            }

            else {

              gpsMarker.setLatLng(
                gpsLatLng
              );

            }


            /* ---------------------------------------------
               ACCURACY CIRCLE
               --------------------------------------------- */

            if (!gpsAccuracyCircle) {

              gpsAccuracyCircle =

                L.circle(

                  gpsLatLng,

                  {

                    radius: accuracy,

                    color: "#0077ff",

                    fillOpacity: 0.08,

                    weight: 1

                  }

                ).addTo(map);

            }

            else {

              gpsAccuracyCircle.setLatLng(
                gpsLatLng
              );

              gpsAccuracyCircle.setRadius(
                accuracy
              );

            }


            /* ---------------------------------------------
               DETERMINE STATE
               --------------------------------------------- */

            const state =

              getHistoricalState(

                latitude,
                longitude

              );


            lastState =
              state;


            /* ---------------------------------------------
               STORE GPS INFORMATION
               --------------------------------------------- */

            latestGPSData = {

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              state:
                state

            };


            /* ---------------------------------------------
               GPS DETAILS BUTTON
               --------------------------------------------- */

            const gpsDetailsButton =

              document.getElementById(
                "gpsDetailsButton"
              );


            gpsDetailsButton.style.display =
              "inline-block";


            /* ---------------------------------------------
               STATUS
               --------------------------------------------- */

            if (gpsDetailsVisible) {

              displayGPSDetails();

            }

            else {

              displayGPSSummary();

            }


            /* ---------------------------------------------
               KEEP GPS DOT CENTERED
               ---------------------------------------------
             *
             * IMPORTANT:
             *
             * This is now conditional on
             * userInteractingWithMap.
             *
             * When a polygon has just been touched,
             * map.setView() will NOT run.
             *
             * Therefore the popup is allowed to remain
             * open.
             */

            const now =
              Date.now();


            if (
              !userInteractingWithMap
            ) {

              if (!gpsHasCentered) {

                map.setView(

                  gpsLatLng,

                  15,

                  {

                    animate:
                      false

                  }

                );


                gpsHasCentered =
                  true;

                lastMapCenterTime =
                  now;


                if (
                  vegetationVisible
                ) {

                  loadVegetation();

                }

              }

              else if (

                now -
                lastMapCenterTime >=
                gpsCenterInterval

              ) {

                map.setView(

                  gpsLatLng,

                  map.getZoom(),

                  {

                    animate:
                      false

                  }

                );


                lastMapCenterTime =
                  now;

              }

            }


            /* ---------------------------------------------
               CURRENT VEGETATION
               --------------------------------------------- */

            if (
              currentVegetationVisible
            ) {

              updateCurrentVegetation(

                latitude,
                longitude

              );

            }

          },


          function(error) {

            if (!gpsEnabled) {

              return;

            }


            setStatus(

              "GPS error: " +
              error.message

            );

          },


          {

            enableHighAccuracy:
              true,

            maximumAge:
              1000,

            timeout:
              15000

          }

        );

    }


    /* =====================================================
       STOP GPS
       ===================================================== */

    function stopGPS() {

      gpsEnabled =
        false;


      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

        watchID =
          null;

      }


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS OFF";

      gpsButton.classList.remove(
        "active"
      );


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsVisible =
        false;


      latestGPSData =
        null;


      /*
       * Remove GPS marker.
       */

      if (gpsMarker) {

        map.removeLayer(
          gpsMarker
        );

        gpsMarker =
          null;

      }


      /*
       * Remove accuracy circle.
       */

      if (gpsAccuracyCircle) {

        map.removeLayer(
          gpsAccuracyCircle
        );

        gpsAccuracyCircle =
          null;

      }


      setStatus(
        "GPS off"
      );

    }


    /* =====================================================
       VEGETATION TOGGLE
       ===================================================== */

    function toggleVegetation() {

      vegetationVisible =
        !vegetationVisible;


      const button =
        document.getElementById(
          "vegetationButton"
        );


      if (!vegetationVisible) {

        button.innerHTML =
          "Vegetation OFF";

        button.classList.remove(
          "active"
        );


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        setStatus(
          gpsEnabled
            ? "GPS active"
            : "Historical vegetation OFF"
        );


        return;

      }


      button.innerHTML =
        "Vegetation ON";

      button.classList.add(
        "active"
      );


      setStatus(
        "Loading historical vegetation..."
      );


      lastVegetationCenter =
        null;


      loadVegetation();

    }


    /* =====================================================
       LOAD VEGETATION
       ===================================================== */

    async function loadVegetation() {

      if (map.getZoom() < 10) {

        setStatus(

          "Zoom in closer to load historical vegetation."

        );

        return;

      }


      const center =
        map.getCenter();


      const state =
        getHistoricalState(

          center.lat,
          center.lng

        );


      if (state !== "Michigan") {

        setStatus(

          "Move the map into Michigan to load historical vegetation."

        );

        return;

      }


      /*
       * Avoid unnecessarily querying the same area.
       */

      if (lastVegetationCenter) {

        const movedDistance =

          map.distance(

            lastVegetationCenter,
            center

          );


        if (
          movedDistance < 250
        ) {

          return;

        }

      }


      lastVegetationCenter =
        center;


      const bounds =
        map.getBounds();


      const west =
        bounds.getWest();

      const south =
        bounds.getSouth();

      const east =
        bounds.getEast();

      const north =
        bounds.getNorth();


      const geometry =

        JSON.stringify({

          xmin:
            west,

          ymin:
            south,

          xmax:
            east,

          ymax:
            north,

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryEnvelope",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME",

          returnGeometry:
            "true",

          outSR:
            "4326",

          f:
            "geojson"

        });


      try {

        const response =

          await fetch(

            michiganURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          setStatus(

            "No historical vegetation polygons were returned."

          );

          return;

        }


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        vegetationLayer =

          L.geoJSON(

            data,

            {

              style:

                function(feature) {

                  const p =
                    feature.properties;


                  const color =

                    getMichiganVegetationColor(

                      p.COVERTYPE

                    );


                  return {

                    color:
                      "#555555",

                    weight:
                      1,

                    fillColor:
                      color,

                    fillOpacity:
                      0.65

                  };

                },


              onEachFeature:

                function(
                  feature,
                  layer
                ) {

                  const p =
                    feature.properties;


                  /*
                   * ------------------------------------------------
                   * DETERMINE A REPRESENTATIVE POINT
                   * ------------------------------------------------
                   *
                   * We need latitude/longitude so that the
                   * tension-zone logic can determine whether
                   * the clicked polygon should use a northern
                   * or southern MNFI community page.
                   */

                  let polygonCenter;


                  try {

                    polygonCenter =
                      layer.getBounds().getCenter();

                  }

                  catch(error) {

                    polygonCenter =
                      map.getCenter();

                  }


                  const clickLatitude =
                    polygonCenter.lat;

                  const clickLongitude =
                    polygonCenter.lng;


                  const coverType =
                    p.COVERTYPE ||
                    "Unknown";


                  /*
                   * ------------------------------------------------
                   * COMMUNITY LINK
                   * ------------------------------------------------
                   */

                  const communityLink =

                    createMNFILink(

                      coverType,

                      clickLatitude,

                      clickLongitude

                    );


                  /*
                   * ------------------------------------------------
                   * POPUP
                   * ------------------------------------------------
                   */

                  let popup =

                    "<strong>" +

                    "Michigan Circa-1800 Vegetation" +

                    "</strong>" +

                    "<br><br>" +

                    "<strong>Historical cover type:</strong><br>" +

                    coverType +

                    "<br><br>" +

                    "<strong>Vegetation code:</strong> " +

                    (

                      p.VEGCODE ||
                      "Unknown"

                    ) +

                    "<br><br>" +

                    "<strong>County:</strong> " +

                    (

                      p.CNTY_NAME ||
                      "Unknown"

                    );


                  /*
                   * Add the MNFI community link when
                   * this historical cover type has a
                   * reasonable modern community match.
                   */

                  popup +=
                    communityLink;


                  layer.bindPopup(

                    popup,

                    {

                      /*
                       * Keep the popup open as long as
                       * possible during touch interaction.
                       */

                      closeButton:
                        true,

                      autoPan:
                        true,

                      autoPanPadding:
                        [30, 30]

                    }

                  );


                  /* ----------------------------------------------
                     CLICK
                     ---------------------------------------------- */

                  layer.on(

                    "click",

                    function(e) {

                      /*
                       * THIS IS THE IMPORTANT FIX.
                       *
                       * Tell GPS following to stop calling
                       * map.setView() for a short period.
                       */

                      pauseGPSAutoCentering();


                      /*
                       * Stop this click from bubbling into
                       * the underlying map.
                       */

                      if (
                        e.originalEvent
                      ) {

                        L.DomEvent.stopPropagation(
                          e.originalEvent
                        );

                      }


                      /*
                       * Explicitly open the popup here.
                       * This makes touch behavior more
                       * reliable on phones.
                       */

                      layer.openPopup();

                    }

                  );


                  /* ----------------------------------------------
                     TOUCH START
                     ---------------------------------------------- */

                  layer.on(

                    "touchstart",

                    function() {

                      pauseGPSAutoCentering();

                    }

                  );


                  /* ----------------------------------------------
                     MOUSEOVER
                     ---------------------------------------------- */

                  layer.on(

                    "mouseover",

                    function(e) {

                      e.target.setStyle({

                        weight:
                          3,

                        color:
                          "#000000",

                        fillOpacity:
                          0.85

                      });

                    }

                  );


                  /* ----------------------------------------------
                     MOUSEOUT
                     ---------------------------------------------- */

                  layer.on(

                    "mouseout",

                    function(e) {

                      if (
                        vegetationLayer
                      ) {

                        vegetationLayer.resetStyle(
                          e.target
                        );

                      }

                    }

                  );


                  /* ----------------------------------------------
                     POPUP OPEN
                     ---------------------------------------------- */

                  layer.on(

                    "popupopen",

                    function() {

                      pauseGPSAutoCentering();

                    }

                  );

                }

            }

          );


        vegetationLayer.addTo(
          map
        );


        setStatus(

          "Historical vegetation ON<br>" +

          "Michigan: " +

          data.features.length +

          " polygons loaded"

        );

      }


      catch(error) {

        console.error(

          "Vegetation loading error:",
          error

        );


        setStatus(

          "Vegetation error:<br>" +
          error.message

        );

      }

    }


    /* =====================================================
       CURRENT VEGETATION TOGGLE
       ===================================================== */

    function toggleCurrentVegetation() {

      currentVegetationVisible =
        !currentVegetationVisible;


      const button =
        document.getElementById(
          "currentButton"
        );


      const box =
        document.getElementById(
          "currentVegetation"
        );


      if (!currentVegetationVisible) {

        button.classList.remove(
          "active"
        );

        box.style.display =
          "none";

        return;

      }


      button.classList.add(
        "active"
      );


      box.style.display =
        "block";


      if (!gpsMarker) {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "Turn GPS on first";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "Your current location is needed to identify the historical vegetation.";

        return;

      }


      const position =
        gpsMarker.getLatLng();


      updateCurrentVegetation(

        position.lat,
        position.lng

      );

    }


    /* =====================================================
       UPDATE CURRENT VEGETATION
       ===================================================== */

    async function updateCurrentVegetation(

      latitude,
      longitude

    ) {

      const state =
        getHistoricalState(

          latitude,
          longitude

        );


      const positionKey =

        state +
        "|" +
        latitude.toFixed(5) +
        "," +
        longitude.toFixed(5);


      if (

        positionKey ===
        lastVegetationPosition

      ) {

        return;

      }


      lastVegetationPosition =
        positionKey;


      if (state !== "Michigan") {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "No historical dataset";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "The current GPS location is outside the Michigan historical vegetation dataset.";

        return;

      }


      const geometry =

        JSON.stringify({

          x:
            longitude,

          y:
            latitude,

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryPoint",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME",

          returnGeometry:
            "false",

          outSR:
            "4326",

          f:
            "json"

        });


      try {

        const response =

          await fetch(

            michiganURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          document.getElementById(
            "currentType"
          ).innerHTML =

            "No mapped historical vegetation";


          document.getElementById(
            "currentDetails"
          ).innerHTML =

            "No historical polygon was found at your GPS location.";

          return;

        }


        const properties =
          data.features[0].attributes;


        const coverType =
          properties.COVERTYPE ||
          "Unknown";


        const vegCode =
          properties.VEGCODE ||
          "Unknown";


        const county =
          properties.CNTY_NAME ||
          "Unknown";


        document.getElementById(
          "currentType"
        ).innerHTML =

          formatVegetationName(
            coverType
          );


        let details =

          "<strong>Michigan MNFI circa-1800</strong>" +

          "<br>" +

          "Vegetation code: " +
          vegCode +

          "<br>" +

          "County: " +
          county;


        /*
         * Add the appropriate modern MNFI
         * community classification when one exists.
         */

        const community =

          getMNFICommunity(

            coverType,

            latitude,

            longitude

          );


        if (community) {

          details +=

            "<br><br>" +

            "<strong>MNFI community:</strong> " +

            community.name;


          if (
            community.tensionSensitive
          ) {

            details +=

              "<br>" +

              (

                isSouthOfTensionZone(
                  latitude,
                  longitude
                )

                  ? "South of"
                  : "North of"

              ) +

              " approximate tension zone";

          }


          details +=

            "<br>" +

            '<a class="mnfi-link" ' +

            'href="' +
            community.url +
            '" ' +

            'target="_blank" ' +

            'rel="noopener noreferrer">' +

            "View MNFI community page" +

            "</a>";

        }


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          details;

      }


      catch(error) {

        console.error(

          "Current vegetation error:",
          error

        );


        document.getElementById(
          "currentType"
        ).innerHTML =
          "Unable to identify vegetation";


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          error.message;

      }

    }


    /* =====================================================
       FORMAT VEGETATION NAME
       ===================================================== */

    function formatVegetationName(
      name
    ) {

      if (!name) {

        return "Unknown";

      }


      return name
        .toLowerCase()
        .replace(

          /\b\w/g,

          function(letter) {

            return letter.toUpperCase();

          }

        );

    }


    /* =====================================================
       MICHIGAN VEGETATION COLORS
       ===================================================== */

    function getMichiganVegetationColor(
      coverType
    ) {

      const key =

        coverType

          ? String(coverType)
              .trim()
              .toUpperCase()

          : "";


      const colors = {

        "ASPEN-BIRCH FOREST":
          "rgb(127,163,98)",

        "BEECH-SUGAR MAPLE FOREST":
          "rgb(143,173,106)",

        "BEECH-SUGAR MAPLE-HEMLOCK FOREST":
          "rgb(160,186,115)",

        "BLACK ASH SWAMP":
          "rgb(179,199,125)",

        "BLACK OAK BARREN":
          "rgb(195,209,134)",

        "CEDAR SWAMP":
          "rgb(214,222,146)",

        "EXPOSED BEDROCK":
          "rgb(232,232,155)",

        "GRASSLAND":
          "rgb(242,237,162)",

        "HEMLOCK-WHITE PINE FOREST":
          "rgb(242,234,160)",

        "HEMLOCK-YELLOW BIRCH FOREST":
          "rgb(242,231,155)",

        "JACK PINE-RED PINE FOREST":
          "rgb(242,226,153)",

        "LAKE/RIVER":
          "rgb(242,222,148)",

        "MIXED CONIFER SWAMP":
          "rgb(242,217,143)",

        "MIXED HARDWOOD SWAMP":
          "rgb(242,213,141)",

        "MIXED OAK FOREST":
          "rgb(242,208,136)",

        "MIXED OAK SAVANNA":
          "rgb(240,201,134)",

        "MIXED PINE-OAK FOREST":
          "rgb(232,190,132)",

        "MUSKEG/BOG":
          "rgb(227,181,132)",

        "OAK-HICKORY FOREST":
          "rgb(219,173,132)",

        "OAK/PINE BARRENS":
          "rgb(214,165,131)",

        "PINE BARRENS":
          "rgb(207,156,128)",

        "SAND DUNE":
          "rgb(201,149,127)",

        "SHRUB SWAMP/EMERGENT MARSH":
          "rgb(194,140,124)",

        "SPRUCE-FIR-CEDAR FOREST":
          "rgb(201,148,137)",

        "SUGAR MAPLE-BASSWOOD FOREST":
          "rgb(212,158,155)",

        "SUGAR MAPLE-HEMLOCK FOREST":
          "rgb(219,171,174)",

        "SUGAR MAPLE-YELLOW BIRCH FOREST":
          "rgb(227,184,192)",

        "WET PRAIRIE":
          "rgb(235,197,210)",

        "WHITE PINE-MIXED HARDWOOD FOREST":
          "rgb(240,211,225)",

        "WHITE PINE-RED PINE FOREST":
          "rgb(247,228,242)",

        "WHITE PINE-WHITE OAK FOREST":
          "rgb(255,242,255)"

      };


      return (

        colors[key] ||
        "#cccccc"

      );

    }


    /* =====================================================
       MAP MOVE / VEGETATION RELOAD
       ===================================================== */

    let reloadTimer =
      null;


    map.on(

      "moveend",

      function() {

        if (!vegetationVisible) {

          return;

        }


        clearTimeout(
          reloadTimer
        );


        reloadTimer =

          setTimeout(

            function() {

              loadVegetation();

            },

            750

          );

      }

    );


    /* =====================================================
       USER MAP INTERACTION
       =====================================================
       *
       * If the user manually drags the map, we don't want
       * the next GPS update to immediately yank the map
       * back underneath their finger.
       *
       * This also makes exploring the historical layer
       * much easier.
       */

    map.on(

      "dragstart",

      function() {

        pauseGPSAutoCentering();

      }

    );


    map.on(

      "zoomstart",

      function() {

        pauseGPSAutoCentering();

      }

    );


  </script>
