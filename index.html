<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Historical Vegetation Navigator</title>


  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body {

      height: 100%;
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

      overflow: hidden;

    }


    #map {

      height: 100%;
      width: 100%;

    }


    /* =====================================================
       MAP ROTATION
       ===================================================== */

    #map .leaflet-map-pane {

      transform-origin: center center;

    }


    /* =====================================================
       COMPACT CONTROLS
       ===================================================== */

    #controls {

      position: absolute;

      top: 8px;
      left: 8px;

      right: auto;

      max-width: calc(100% - 16px);

      z-index: 1000;

      background: rgba(255,255,255,0.94);

      padding: 7px;

      border-radius: 7px;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.22);

      box-sizing: border-box;

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      font-size: 14px;

      padding: 7px 10px;

      margin-right: 4px;

      margin-bottom: 4px;

      border: none;

      border-radius: 6px;

      background: #2c6e49;

      color: white;

      line-height: 1.1;

    }


    button:active {

      background: #1f5035;

    }


    #vegetationButton.active {

      background: #8b5a2b;

    }


    #currentButton.active {

      background: #245c9c;

    }


    #directionButton.active {

      background: #7a3e9d;

    }


    /* =====================================================
       GPS DETAILS BUTTON
       ===================================================== */

    #gpsDetailsButton {

      display: none;

      background: #555;

      font-size: 12px;

      padding: 5px 8px;

      margin-top: 2px;

      margin-bottom: 3px;

    }


    #gpsDetailsButton.active {

      background: #333;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      margin-top: 3px;

      font-size: 12px;

      line-height: 1.25;

      max-width: 300px;

    }


    /* =====================================================
       CURRENT VEGETATION BOX
       ===================================================== */

    #currentVegetation {

      display: none;

      margin-top: 6px;

      padding: 7px;

      border-radius: 6px;

      background: rgba(243,243,243,0.95);

      border-left: 4px solid #2c6e49;

      max-width: 300px;

    }


    #currentTitle {

      font-size: 11px;

      font-weight: bold;

      color: #555;

      margin-bottom: 3px;

    }


    #currentType {

      font-size: 17px;

      font-weight: bold;

      line-height: 1.15;

    }


    #currentDetails {

      margin-top: 4px;

      font-size: 11px;

      line-height: 1.25;

      color: #555;

    }


    /* =====================================================
       SMALL SCREENS
       ===================================================== */

    @media (max-width: 500px) {

      #controls {

        top: 6px;
        left: 6px;

        padding: 6px;

        max-width: calc(100% - 12px);

      }


      button {

        font-size: 13px;

        padding: 6px 8px;

        margin-right: 3px;

        margin-bottom: 3px;

      }


      #gpsDetailsButton {

        font-size: 11px;

        padding: 5px 7px;

      }


      #status {

        font-size: 11px;

        line-height: 1.2;

        max-width: 280px;

      }


      #currentVegetation {

        max-width: 280px;

        padding: 6px;

        margin-top: 5px;

      }


      #currentTitle {

        font-size: 10px;

      }


      #currentType {

        font-size: 15px;

      }


      #currentDetails {

        font-size: 10px;

      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       CONTROLS
       ======================================================= -->

  <div id="controls">


    <button onclick="startGPS()">

      Start GPS

    </button>


    <button
      id="vegetationButton"
      onclick="toggleVegetation()"
    >

      Vegetation OFF

    </button>


    <button
      id="currentButton"
      onclick="toggleCurrentVegetation()"
    >

      Current Vegetation

    </button>


    <button
      id="directionButton"
      onclick="toggleDirection()"
    >

      Direction OFF

    </button>


    <!-- GPS DETAILS BUTTON -->

    <button
      id="gpsDetailsButton"
      onclick="toggleGPSDetails()"
    >

      GPS Details

    </button>


    <div id="status">

      GPS not started

    </div>


    <!-- CURRENT VEGETATION DISPLAY -->

    <div id="currentVegetation">

      <div id="currentTitle">

        HISTORICAL VEGETATION AT YOUR LOCATION

      </div>


      <div id="currentType">

        Searching...

      </div>


      <div id="currentDetails">

      </div>

    </div>


  </div>


  <!-- MAP -->

  <div id="map"></div>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* ========================================================
       MAP
       ======================================================== */

    const map = L.map("map").setView(

      [44.5, -84.5],

      7

    );


    /* ========================================================
       BASEMAP
       ======================================================== */

    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }

    ).addTo(map);


    /* ========================================================
       GPS VARIABLES
       ======================================================== */

    let gpsMarker = null;

    let gpsAccuracyCircle = null;

    let watchID = null;

    let gpsHasCentered = false;


    /*
     * GPS diagnostic information.
     *
     * The information is still continuously updated,
     * but is hidden from the normal interface.
     */

    let gpsDetailsVisible = false;

    let latestGPSData = null;


    /*
     * Prevent excessively frequent map movement.
     */

    let lastMapCenterTime = 0;

    const gpsCenterInterval = 500;


    /* ========================================================
       DIRECTION / ROTATION VARIABLES
       ======================================================== */

    let directionEnabled = false;

    let currentHeading = 0;

    let previousGPSPosition = null;

    let lastHeadingUpdateTime = 0;


    /*
     * Minimum speed required before we trust calculated
     * direction of travel.
     *
     * 1.5 m/s ≈ 3.4 mph
     */

    const minimumHeadingSpeed = 1.5;


    /*
     * Don't update map rotation too frequently.
     */

    const headingUpdateInterval = 500;


    /* ========================================================
       VEGETATION VARIABLES
       ======================================================== */

    let vegetationLayer = null;

    let vegetationVisible = false;

    let lastVegetationCenter = null;


    /* ========================================================
       CURRENT VEGETATION VARIABLES
       ======================================================== */

    let currentVegetationVisible = false;

    let lastVegetationPosition = null;

    let lastState = null;


    /* ========================================================
       HISTORICAL VEGETATION SERVICES
       ======================================================== */


    /*
     * MICHIGAN
     */

    const michiganURL =

      "https://services1.arcgis.com/4ezfu5dIwH83BUNL/ArcGIS/rest/services/Michigan_Land_Cover_Circa_1800/FeatureServer/0";


    /*
     * ILLINOIS
     */

    const illinoisURL =

      "https://gis.prairie.illinois.edu/arcgis/rest/services/Land_Cover/Presettlement_LandCover_All/MapServer/0";


    /* ========================================================
       STATUS
       ======================================================== */

    function setStatus(message) {

      document.getElementById(
        "status"
      ).innerHTML = message;

    }


    /* ========================================================
       GPS DETAILS TOGGLE
       ======================================================== */

    function toggleGPSDetails() {

      gpsDetailsVisible =

        !gpsDetailsVisible;


      const button =

        document.getElementById(
          "gpsDetailsButton"
        );


      if (gpsDetailsVisible) {


        button.innerHTML =
          "Hide GPS Details";


        button.classList.add(
          "active"
        );


        displayGPSDetails();

      }

      else {


        button.innerHTML =
          "GPS Details";


        button.classList.remove(
          "active"
        );


        displayGPSSummary();

      }

    }


    /* ========================================================
       DISPLAY GPS SUMMARY
       ======================================================== */

    function displayGPSSummary() {


      if (!latestGPSData) {

        setStatus(
          "GPS not started"
        );

        return;

      }


      const stateText =

        latestGPSData.state ||

        "Outside current historical coverage";


      setStatus(

        "GPS active<br>" +

        "Historical dataset: " +

        stateText

      );

    }


    /* ========================================================
       DISPLAY GPS DETAILS
       ======================================================== */

    function displayGPSDetails() {


      if (!latestGPSData) {

        return;

      }


      const data =
        latestGPSData;


      const stateText =

        data.state ||

        "Outside current historical coverage";


      setStatus(

        "GPS active<br>" +

        "Latitude: " +

        data.latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +

        data.longitude.toFixed(6) +

        "<br>" +

        "Accuracy: approximately " +

        Math.round(data.accuracy) +

        " meters" +

        "<br>" +

        "Historical dataset: " +

        stateText

      );

    }


    /* ========================================================
       DETERMINE STATE FROM GPS
       ======================================================== */

    function getHistoricalState(
      latitude,
      longitude
    ) {


      const inMichigan =

        (
          longitude >= -90.5 &&
          longitude <= -82.0 &&
          latitude >= 41.5 &&
          latitude <= 49.0
        );


      const inIllinois =

        (
          longitude >= -91.6 &&
          longitude <= -87.0 &&
          latitude >= 36.9 &&
          latitude <= 42.6
        );


      if (
        inMichigan &&
        !(
          longitude < -87.0 &&
          latitude < 42.6
        )
      ) {

        return "Michigan";

      }


      if (inIllinois) {

        return "Illinois";

      }


      return null;

    }


    /* ========================================================
       CALCULATE BEARING
       ======================================================== */

    function calculateBearing(
      lat1,
      lon1,
      lat2,
      lon2
    ) {


      const radians =

        Math.PI / 180;


      const phi1 =
        lat1 * radians;


      const phi2 =
        lat2 * radians;


      const deltaLon =

        (
          lon2 -
          lon1
        ) * radians;


      const y =

        Math.sin(deltaLon) *
        Math.cos(phi2);


      const x =

        Math.cos(phi1) *
        Math.sin(phi2) -

        Math.sin(phi1) *
        Math.cos(phi2) *
        Math.cos(deltaLon);


      let bearing =

        Math.atan2(
          y,
          x
        ) / radians;


      bearing =

        (
          bearing + 360
        ) % 360;


      return bearing;

    }


    /* ========================================================
       NORMALIZE ANGLE
       ======================================================== */

    function normalizeAngle(angle) {

      return (

        (
          angle + 360
        ) % 360

      );

    }


    /* ========================================================
       SHORTEST ANGLE DIFFERENCE
       ======================================================== */

    function shortestAngleDifference(
      from,
      to
    ) {


      return (

        (
          (
            to -
            from +
            540
          ) % 360
        ) - 180

      );

    }


    /* ========================================================
       ROTATE MAP
       ======================================================== */

    function rotateMapToHeading(
      heading
    ) {


      if (!directionEnabled) {

        return;

      }


      /*
       * We want the direction of travel to point
       * toward the top of the screen.
       *
       * Therefore the map itself rotates opposite
       * the travel heading.
       */

      const rotation =

        -heading;


      const mapPane =

        document.querySelector(
          "#map .leaflet-map-pane"
        );


      if (!mapPane) {

        return;

      }


      mapPane.style.transform =

        "rotate(" +
        rotation +
        "deg)";

    }


    /* ========================================================
       RESET MAP ROTATION
       ======================================================== */

    function resetMapRotation() {


      const mapPane =

        document.querySelector(
          "#map .leaflet-map-pane"
        );


      if (!mapPane) {

        return;

      }


      mapPane.style.transform =

        "rotate(0deg)";

    }


    /* ========================================================
       TOGGLE DIRECTION
       ======================================================== */

    function toggleDirection() {


      directionEnabled =

        !directionEnabled;


      const button =

        document.getElementById(
          "directionButton"
        );


      if (directionEnabled) {


        button.innerHTML =
          "Direction ON";


        button.classList.add(
          "active"
        );


        /*
         * If we already have a reliable heading,
         * immediately rotate the map.
         */

        if (
          previousGPSPosition &&
          currentHeading !== null
        ) {

          rotateMapToHeading(
            currentHeading
          );

        }


      }

      else {


        button.innerHTML =
          "Direction OFF";


        button.classList.remove(
          "active"
        );


        /*
         * Return map to north-up orientation.
         */

        resetMapRotation();

      }

    }


    /* ========================================================
       UPDATE HEADING
       ======================================================== */

    function updateHeading(
      position
    ) {


      const latitude =

        position.coords.latitude;


      const longitude =

        position.coords.longitude;


      const speed =

        position.coords.speed;


      const deviceHeading =

        position.coords.heading;


      let heading = null;


      /*
       * ----------------------------------------------------
       * OPTION 1
       * USE DEVICE-PROVIDED HEADING
       * ----------------------------------------------------
       */

      if (

        deviceHeading !== null &&
        !isNaN(deviceHeading) &&
        deviceHeading >= 0

      ) {


        if (

          speed === null ||
          speed >= minimumHeadingSpeed

        ) {

          heading =
            deviceHeading;

        }

      }


      /*
       * ----------------------------------------------------
       * OPTION 2
       * CALCULATE HEADING FROM GPS MOVEMENT
       * ----------------------------------------------------
       */

      if (

        heading === null &&
        previousGPSPosition

      ) {


        const distance =

          map.distance(

            [
              previousGPSPosition.latitude,
              previousGPSPosition.longitude
            ],

            [
              latitude,
              longitude
            ]

          );


        const timeDifference =

          (
            position.timestamp -
            previousGPSPosition.timestamp
          ) / 1000;


        let calculatedSpeed = 0;


        if (timeDifference > 0) {

          calculatedSpeed =

            distance /
            timeDifference;

        }


        if (
          calculatedSpeed >=
          minimumHeadingSpeed
        ) {


          heading =

            calculateBearing(

              previousGPSPosition.latitude,

              previousGPSPosition.longitude,

              latitude,

              longitude

            );

        }

      }


      /*
       * Save current GPS position for
       * the next heading calculation.
       */

      previousGPSPosition = {

        latitude:
          latitude,

        longitude:
          longitude,

        timestamp:
          position.timestamp

      };


      /*
       * No reliable heading yet.
       */

      if (heading === null) {

        return;

      }


      const now = Date.now();


      if (

        now -
        lastHeadingUpdateTime <
        headingUpdateInterval

      ) {

        return;

      }


      lastHeadingUpdateTime = now;


      /*
       * Smooth sudden heading changes.
       */

      if (
        currentHeading !== null &&
        !isNaN(currentHeading)
      ) {


        const difference =

          shortestAngleDifference(

            currentHeading,

            heading

          );


        /*
         * Smooth about 30% toward the new heading.
         */

        currentHeading =

          normalizeAngle(

            currentHeading +
            difference * 0.30

          );

      }

      else {

        currentHeading =
          heading;

      }


      if (directionEnabled) {

        rotateMapToHeading(
          currentHeading
        );

      }

    }


    /* ========================================================
       START GPS
       ======================================================== */

    function startGPS() {


      if (!navigator.geolocation) {

        setStatus(
          "GPS is not supported by this device."
        );

        return;

      }


      gpsHasCentered = false;

      lastMapCenterTime = 0;

      lastVegetationCenter = null;

      previousGPSPosition = null;

      currentHeading = 0;

      lastHeadingUpdateTime = 0;


      /*
       * Start each GPS session with the diagnostic
       * display collapsed.
       */

      gpsDetailsVisible = false;

      latestGPSData = null;


      const gpsDetailsButton =

        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsButton.innerHTML =
        "GPS Details";


      gpsDetailsButton.classList.remove(
        "active"
      );


      setStatus(
        "Waiting for GPS location..."
      );


      /*
       * Prevent duplicate GPS watches.
       */

      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

      }


      watchID =

        navigator.geolocation.watchPosition(

          function(position) {


            const latitude =

              position.coords.latitude;


            const longitude =

              position.coords.longitude;


            const accuracy =

              position.coords.accuracy;


            const gpsLatLng =

              [
                latitude,
                longitude
              ];


            /* ----------------------------------------------
               GPS MARKER
               ---------------------------------------------- */

            if (!gpsMarker) {


              gpsMarker =

                L.circleMarker(

                  gpsLatLng,

                  {

                    radius: 9,

                    color: "white",

                    weight: 3,

                    fillColor: "#0077ff",

                    fillOpacity: 1

                  }

                ).addTo(map);

            }

            else {


              gpsMarker.setLatLng(
                gpsLatLng
              );

            }


            /* ----------------------------------------------
               ACCURACY CIRCLE
               ---------------------------------------------- */

            if (!gpsAccuracyCircle) {


              gpsAccuracyCircle =

                L.circle(

                  gpsLatLng,

                  {

                    radius: accuracy,

                    color: "#0077ff",

                    fillOpacity: 0.08,

                    weight: 1

                  }

                ).addTo(map);

            }

            else {


              gpsAccuracyCircle.setLatLng(
                gpsLatLng
              );


              gpsAccuracyCircle.setRadius(
                accuracy
              );

            }


            /* ----------------------------------------------
               UPDATE DIRECTION
               ---------------------------------------------- */

            updateHeading(
              position
            );


            /* ----------------------------------------------
               KEEP GPS DOT CENTERED
               ---------------------------------------------- */

            const now = Date.now();


            /*
             * FIRST GPS FIX
             */

            if (!gpsHasCentered) {


              map.setView(

                gpsLatLng,

                15,

                {

                  animate: false

                }

              );


              gpsHasCentered = true;

              lastMapCenterTime = now;


              if (vegetationVisible) {

                loadVegetation();

              }

            }


            /*
             * SUBSEQUENT GPS FIXES
             */

            else if (

              now -
              lastMapCenterTime >=
              gpsCenterInterval

            ) {


              map.setView(

                gpsLatLng,

                map.getZoom(),

                {

                  animate: false

                }

              );


              lastMapCenterTime = now;

            }


            /* ----------------------------------------------
               DETERMINE STATE
               ---------------------------------------------- */

            const state =

              getHistoricalState(

                latitude,
                longitude

              );


            lastState = state;


            /* ----------------------------------------------
               STORE GPS DIAGNOSTIC INFORMATION
               ---------------------------------------------- */

            latestGPSData = {

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              state:
                state

            };


            /*
             * GPS Details becomes available after
             * the first valid GPS fix.
             */

            const gpsDetailsButton =

              document.getElementById(
                "gpsDetailsButton"
              );


            gpsDetailsButton.style.display =
              "inline-block";


            /* ----------------------------------------------
               STATUS
               ---------------------------------------------- */

            if (gpsDetailsVisible) {

              displayGPSDetails();

            }

            else {

              displayGPSSummary();

            }


            /* ----------------------------------------------
               CURRENT VEGETATION
               ---------------------------------------------- */

            if (currentVegetationVisible) {

              updateCurrentVegetation(

                latitude,
                longitude

              );

            }

          },


          function(error) {


            /*
             * GPS errors remain visible automatically.
             * This makes troubleshooting possible even
             * when GPS Details is collapsed.
             */

            setStatus(

              "GPS error: " +
              error.message

            );

          },


          {

            enableHighAccuracy: true,

            maximumAge: 1000,

            timeout: 15000

          }

        );

    }


    /* ========================================================
       VEGETATION MAP TOGGLE
       ======================================================== */

    function toggleVegetation() {


      vegetationVisible =

        !vegetationVisible;


      const button =

        document.getElementById(
          "vegetationButton"
        );


      if (!vegetationVisible) {


        button.innerHTML =
          "Vegetation OFF";


        button.classList.remove(
          "active"
        );


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        setStatus(
          "Historical vegetation OFF"
        );


        return;

      }


      button.innerHTML =
        "Vegetation ON";


      button.classList.add(
        "active"
      );


      setStatus(
        "Loading historical vegetation..."
      );


      lastVegetationCenter = null;


      loadVegetation();

    }


    /* ========================================================
       LOAD VEGETATION MAP
       ======================================================== */

    async function loadVegetation() {


      if (map.getZoom() < 10) {


        setStatus(

          "Zoom in closer to load historical vegetation."

        );


        return;

      }


      const center =

        map.getCenter();


      const state =

        getHistoricalState(

          center.lat,
          center.lng

        );


      if (!state) {


        setStatus(

          "Move the map into Michigan or Illinois to load historical vegetation."

        );


        return;

      }


      /*
       * Avoid unnecessary queries.
       */

      if (lastVegetationCenter) {


        const movedDistance =

          map.distance(

            lastVegetationCenter,

            center

          );


        if (movedDistance < 250) {

          return;

        }

      }


      lastVegetationCenter = center;


      const bounds =
        map.getBounds();


      const west =
        bounds.getWest();


      const south =
        bounds.getSouth();


      const east =
        bounds.getEast();


      const north =
        bounds.getNorth();


      let url;

      let inSR;

      let outFields;


      /* ----------------------------------------------------
         MICHIGAN
         ---------------------------------------------------- */

      if (state === "Michigan") {


        url =
          michiganURL;


        inSR =
          "4326";


        outFields =
          "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME";

      }


      /* ----------------------------------------------------
         ILLINOIS
         ---------------------------------------------------- */

      else {


        url =
          illinoisURL;


        inSR =
          "4326";


        outFields =
          "LAND_CODE,MAP,ACRES,GLO_PY6_ID";

      }


      const geometry =

        JSON.stringify({

          xmin:
            west,

          ymin:
            south,

          xmax:
            east,

          ymax:
            north,

          spatialReference: {

            wkid: 4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryEnvelope",

          inSR:
            inSR,

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            outFields,

          returnGeometry:
            "true",

          outSR:
            "4326",

          f:
            "geojson"

        });


      try {


        const response =

          await fetch(

            url +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {


          setStatus(

            "No historical vegetation polygons were returned."

          );


          return;

        }


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        vegetationLayer =

          L.geoJSON(

            data,

            {

              style:

                function(feature) {


                  const p =
                    feature.properties;


                  let color;


                  if (state === "Michigan") {


                    color =

                      getMichiganVegetationColor(

                        p.COVERTYPE

                      );

                  }

                  else {


                    color =

                      getIllinoisVegetationColor(

                        p.LAND_CODE

                      );

                  }


                  return {

                    color:
                      "#555555",

                    weight:
                      1,

                    fillColor:
                      color,

                    fillOpacity:
                      0.65

                  };

                },


              onEachFeature:

                function(
                  feature,
                  layer
                ) {


                  const p =
                    feature.properties;


                  let popup;


                  if (state === "Michigan") {


                    popup =

                      "<strong>" +
                      "Michigan Circa-1800 Vegetation" +
                      "</strong>" +

                      "<br><br>" +

                      "<strong>Historical cover type:</strong><br>" +

                      (
                        p.COVERTYPE ||
                        "Unknown"
                      ) +

                      "<br><br>" +

                      "<strong>Vegetation code:</strong> " +

                      (
                        p.VEGCODE ||
                        "Unknown"
                      ) +

                      "<br><br>" +

                      "<strong>County:</strong> " +

                      (
                        p.CNTY_NAME ||
                        "Unknown"
                      );

                  }

                  else {


                    popup =

                      "<strong>" +
                      "Illinois Early-1800s Land Cover" +
                      "</strong>" +

                      "<br><br>" +

                      "<strong>Historical land cover:</strong><br>" +

                      getIllinoisLandName(

                        p.LAND_CODE

                      ) +

                      "<br><br>" +

                      "<strong>Land code:</strong> " +

                      (
                        p.LAND_CODE ||
                        "Unknown"
                      ) +

                      "<br><br>" +

                      "<strong>GLO ID:</strong> " +

                      (
                        p.GLO_PY6_ID ||
                        "Unknown"
                      );

                  }


                  layer.bindPopup(
                    popup
                  );


                  layer.on(

                    "mouseover",

                    function(e) {


                      e.target.setStyle({

                        weight: 3,

                        color: "#000000",

                        fillOpacity: 0.85

                      });

                    }

                  );


                  layer.on(

                    "mouseout",

                    function(e) {


                      vegetationLayer.resetStyle(

                        e.target

                      );

                    }

                  );

                }

            }

          );


        vegetationLayer.addTo(
          map
        );


        setStatus(

          "Historical vegetation ON<br>" +

          state +

          ": " +

          data.features.length +

          " polygons loaded"

        );

      }


      catch(error) {


        console.error(

          "Vegetation loading error:",
          error

        );


        setStatus(

          "Vegetation error:<br>" +
          error.message

        );

      }

    }


    /* ========================================================
       CURRENT VEGETATION TOGGLE
       ======================================================== */

    function toggleCurrentVegetation() {


      currentVegetationVisible =

        !currentVegetationVisible;


      const button =

        document.getElementById(
          "currentButton"
        );


      const box =

        document.getElementById(
          "currentVegetation"
        );


      if (!currentVegetationVisible) {


        button.classList.remove(
          "active"
        );


        box.style.display =
          "none";


        return;

      }


      button.classList.add(
        "active"
      );


      box.style.display =
        "block";


      if (!gpsMarker) {


        document.getElementById(
          "currentType"
        ).innerHTML =

          "Start GPS first";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "Your current location is needed to identify the historical vegetation.";

        return;

      }


      const position =
        gpsMarker.getLatLng();


      updateCurrentVegetation(

        position.lat,
        position.lng

      );

    }


    /* ========================================================
       UPDATE CURRENT VEGETATION
       ======================================================== */

    async function updateCurrentVegetation(

      latitude,
      longitude

    ) {


      const state =

        getHistoricalState(

          latitude,
          longitude

        );


      const positionKey =

        state +

        "|" +

        latitude.toFixed(5) +

        "," +

        longitude.toFixed(5);


      if (

        positionKey ===
        lastVegetationPosition

      ) {

        return;

      }


      lastVegetationPosition =
        positionKey;


      if (!state) {


        document.getElementById(
          "currentType"
        ).innerHTML =

          "No historical dataset";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "The current GPS location is outside the Michigan and Illinois historical vegetation datasets.";

        return;

      }


      let url;

      let outFields;


      if (state === "Michigan") {


        url =
          michiganURL;


        outFields =
          "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME";

      }


      else {


        url =
          illinoisURL;


        outFields =
          "LAND_CODE,MAP,ACRES,GLO_PY6_ID";

      }


      const geometry =

        JSON.stringify({

          x:
            longitude,

          y:
            latitude,

          spatialReference: {

            wkid: 4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryPoint",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            outFields,

          returnGeometry:
            "false",

          f:
            "json"

        });


      try {


        const response =

          await fetch(

            url +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (

          !data.features ||
          data.features.length === 0

        ) {


          document.getElementById(
            "currentType"
          ).innerHTML =

            "No mapped historical vegetation";


          document.getElementById(
            "currentDetails"
          ).innerHTML =

            "No historical polygon was found at your GPS location.";

          return;

        }


        const properties =

          data.features[0].attributes;


        if (state === "Michigan") {


          const coverType =

            properties.COVERTYPE ||
            "Unknown";


          const vegCode =

            properties.VEGCODE ||
            "Unknown";


          const county =

            properties.CNTY_NAME ||
            "Unknown";


          document.getElementById(
            "currentType"
          ).innerHTML =

            formatVegetationName(
              coverType
            );


          document.getElementById(
            "currentDetails"
          ).innerHTML =

            "<strong>Michigan MNFI circa-1800</strong>" +

            "<br>" +

            "Vegetation code: " +
            vegCode +

            "<br>" +

            "County: " +
            county;

        }


        else {


          const landCode =

            properties.LAND_CODE ||
            "Unknown";


          const landName =

            getIllinoisLandName(
              landCode
            );


          const mapName =

            properties.MAP ||
            "Unknown";


          const acres =

            properties.ACRES ||
            "Unknown";


          document.getElementById(
            "currentType"
          ).innerHTML =

            landName;


          document.getElementById(
            "currentDetails"
          ).innerHTML =

            "<strong>Illinois early-1800s land cover</strong>" +

            "<br>" +

            "Land code: " +
            landCode +

            "<br>" +

            "Original map: " +
            mapName +

            "<br>" +

            "Mapped area: " +
            acres +
            " acres";

        }

      }


      catch(error) {


        console.error(

          "Current vegetation error:",
          error

        );


        document.getElementById(
          "currentType"
        ).innerHTML =

          "Unable to identify vegetation";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          error.message;

      }

    }


    /* ========================================================
       FORMAT VEGETATION NAME
       ======================================================== */

    function formatVegetationName(
      name
    ) {


      if (!name) {

        return "Unknown";

      }


      return name
        .toLowerCase()
        .replace(
          /\b\w/g,
          function(letter) {

            return letter.toUpperCase();

          }
        );

    }

    /* ========================================================

       ======================================================== */

      "moveend",

      function() {


        if (!vegetationVisible) {

          return;

        }


        clearTimeout(
          reloadTimer
        );


        reloadTimer =

          setTimeout(

            function() {

              loadVegetation();

            },

            750

          );
