<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Historical Vegetation Navigator</title>


  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body {

      height: 100%;
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

      overflow: hidden;

    }


    #map {

      height: 100%;
      width: 100%;

    }


    /* =====================================================
       CONTROLS
       ===================================================== */

    #controls {

      position: absolute;

      top: 8px;
      left: 8px;

      right: auto;

      max-width: calc(100% - 16px);

      z-index: 1000;

      background: rgba(255,255,255,0.94);

      padding: 7px;

      border-radius: 7px;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.22);

      box-sizing: border-box;

    }


    /* =====================================================
       BUTTON ROWS
       ===================================================== */

    .control-row {

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      margin: 0;

      padding: 0;

    }


    .control-row + .control-row {

      margin-top: 2px;

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      font-size: 14px;

      padding: 7px 10px;

      margin-right: 4px;

      margin-bottom: 4px;

      border: none;

      border-radius: 6px;

      background: #2c6e49;

      color: white;

      line-height: 1.1;

    }


    button:active {

      background: #1f5035;

    }


    #gpsButton.active {

      background: #245c9c;

    }


    #vegetationButton.active {

      background: #8b5a2b;

    }


    #cornersButton.active {

      background: #245c9c;

    }


    #govButton.active {

      background: #438a3f;

    }


    #currentButton.active {

      background: #245c9c;

    }


    /* =====================================================
       GPS DETAILS BUTTON
       ===================================================== */

    #gpsDetailsButton {

      display: none;

      background: #555;

      font-size: 12px;

      padding: 5px 8px;

      margin-top: 2px;

      margin-bottom: 3px;

    }


    #gpsDetailsButton.active {

      background: #333;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      margin-top: 3px;

      font-size: 12px;

      line-height: 1.25;

      max-width: 300px;

    }


    /* =====================================================
       CURRENT VEGETATION BOX
       ===================================================== */

    #currentVegetation {

      display: none;

      margin-top: 6px;

      padding: 7px;

      border-radius: 6px;

      background: rgba(243,243,243,0.95);

      border-left: 4px solid #2c6e49;

      max-width: 300px;

    }


    #currentTitle {

      font-size: 11px;

      font-weight: bold;

      color: #555;

      margin-bottom: 3px;

    }


    #currentType {

      font-size: 17px;

      font-weight: bold;

      line-height: 1.15;

    }


    #currentDetails {

      margin-top: 4px;

      font-size: 11px;

      line-height: 1.25;

      color: #555;

    }


    /* =====================================================
       MNFI COMMUNITY LINKS
       ===================================================== */

    .mnfi-link {

      display: block;

      width: fit-content;

      margin-top: 8px;

      padding: 6px 9px;

      border-radius: 5px;

      background: #2c6e49;

      color: white !important;

      text-decoration: none;

      font-weight: bold;

      font-size: 12px;

    }


    .mnfi-link:hover {

      background: #1f5035;

    }


    /* =====================================================
       MNFI LINK GROUP
       ===================================================== */

    .mnfi-link-group {

      margin-top: 8px;

    }


    .mnfi-link-group-title {

      font-size: 11px;

      font-weight: bold;

      color: #555;

      margin-bottom: 4px;

    }


    /* =====================================================
       MNFI CLASSIFICATION NOTE
       ===================================================== */

    .mnfi-note {

      margin-top: 8px;

      padding: 6px 8px;

      border-radius: 5px;

      background: #eeeeee;

      color: #555;

      font-size: 10px;

      line-height: 1.3;

    }


    /* =====================================================
       TENSION ZONE NOTE
       ===================================================== */

    .tension-note {

      margin-top: 6px;

      padding-top: 5px;

      border-top: 1px solid #ddd;

      color: #666;

      font-size: 10px;

      line-height: 1.25;

    }


    /* =====================================================
       SMALL SCREENS
       ===================================================== */

    @media (max-width: 500px) {

      #controls {

        top: 6px;
        left: 6px;

        padding: 6px;

        max-width: calc(100% - 12px);

      }


      button {

        font-size: 13px;

        padding: 6px 8px;

        margin-right: 3px;

        margin-bottom: 3px;

      }


      #gpsDetailsButton {

        font-size: 11px;

        padding: 5px 7px;

      }


      #status {

        font-size: 11px;

        line-height: 1.2;

        max-width: 280px;

      }


      #currentVegetation {

        max-width: 280px;

        padding: 6px;

        margin-top: 5px;

      }


      #currentTitle {

        font-size: 10px;

      }


      #currentType {

        font-size: 15px;

      }


      #currentDetails {

        font-size: 10px;

      }


      .mnfi-link {

        font-size: 11px;

        padding: 5px 8px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       CONTROLS
       ===================================================== -->

  <div id="controls">


    <!-- ===================================================
         ROW 1
         GLO / GLO CORNERS / GOVERNMENT PARCELS
         =================================================== -->

    <div class="control-row">


      <button
        id="vegetationButton"
        onclick="toggleVegetation()"
      >

        GLO 1800s OFF

      </button>


      <button
        id="cornersButton"
        onclick="toggleCorners()"
      >

        GLO Corners OFF

      </button>


      <button
        id="govButton"
        onclick="toggleGovernmentParcels()"
      >

        GOV Parcels OFF

      </button>


    </div>


    <!-- ===================================================
         ROW 2
         GPS / WHAT WAS HERE
         =================================================== -->

    <div class="control-row">


      <button
        id="gpsButton"
        onclick="toggleGPS()"
      >

        GPS OFF

      </button>


      <button
        id="currentButton"
        onclick="toggleCurrentVegetation()"
      >

        What Was Here?

      </button>


    </div>


    <button
      id="gpsDetailsButton"
      onclick="toggleGPSDetails()"
    >

      GPS Details

    </button>


    <div id="status">

      GPS off

    </div>


    <!-- CURRENT VEGETATION DISPLAY -->

    <div id="currentVegetation">

      <div id="currentTitle">

        HISTORICAL VEGETATION AT YOUR LOCATION

      </div>


      <div id="currentType">

        Searching...

      </div>


      <div id="currentDetails">

      </div>

    </div>


  </div>


  <!-- =====================================================
       MAP
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* =====================================================
       MAP
       ===================================================== */

    const map =
      L.map("map", {

        zoomControl:
          false

      }).setView(

        [44.5, -84.5],

        7

      );


    /*
     * Move Leaflet zoom controls to the upper-right.
     */

    L.control.zoom({

      position:
        "topright"

    }).addTo(map);


    /* =====================================================
       BASEMAP
       ===================================================== */

    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }

    ).addTo(map);


    /* =====================================================
       GPS VARIABLES
       ===================================================== */

    let gpsMarker = null;

    let gpsAccuracyCircle = null;

    let watchID = null;

    let gpsEnabled = false;

    let gpsHasCentered = false;

    let gpsDetailsVisible = false;

    let latestGPSData = null;

    let lastMapCenterTime = 0;

    const gpsCenterInterval = 500;


    /*
     * GPS following is temporarily suspended when the
     * user interacts with a polygon or manually moves
     * the map.
     */

    let userInteractingWithMap = false;

    let popupInteractionTimer = null;

    const popupPauseDuration = 3000;


    /* =====================================================
       VEGETATION VARIABLES
       ===================================================== */

    let vegetationLayer = null;

    let vegetationVisible = false;

    let lastVegetationCenter = null;


    /*
     * Prevent vegetation from being reloaded when a
     * popup's automatic panning causes a map move.
     */

    let popupIsOpen = false;


    /* =====================================================
       GLO CORNER VARIABLES
       ===================================================== */

    let cornersLayer = null;

    let cornersVisible = false;

    let cornersLastCenter = null;


    /* =====================================================
       GOVERNMENT PARCEL VARIABLES
       ===================================================== */

    let dnrLayer = null;

    let usfsLayer = null;

    let governmentParcelsVisible = false;

    let governmentLastCenter = null;


    /* =====================================================
       CURRENT VEGETATION VARIABLES
       ===================================================== */

    let currentVegetationVisible = false;

    let lastVegetationPosition = null;

    let lastState = null;


    /* =====================================================
       MICHIGAN MNFI CIRCA-1800 SERVICE
       ===================================================== */

    const michiganURL =

      "https://gisp.mcgi.state.mi.us/arcgis/rest/services/EGLE/LandCoverType_1800/FeatureServer/0";


    /* =====================================================
       MICHIGAN DNR PARCEL SERVICE
       ===================================================== */

    const dnrURL =

      "https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRLOTSParcelsOPENDATA/FeatureServer/2";


    /* =====================================================
       US FOREST SERVICE BASIC OWNERSHIP SERVICE
       ===================================================== */

    const usfsURL =

      "https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_BasicOwnership_01/MapServer/0";


    /* =====================================================
       GLO / PUBLIC LAND SURVEY CORNERS
       ===================================================== */

    /*
     * Michigan LARA / DTMB Public Land Survey Corners
     * and Remonumentations.
     *
     * This is a point dataset containing public land
     * survey corners and re-monumented locations.
     */

    const cornersURL =

      "https://gisagocss.state.mi.us/arcgis/rest/services/OpenData/Public_Land_Survey_Corners_and_Remonumentations/MapServer/0";


    /* =====================================================
       STATUS
       ===================================================== */

    function setStatus(message) {

      document.getElementById(
        "status"
      ).innerHTML = message;

    }


    /* =====================================================
       PAUSE AUTOMATIC GPS CENTERING
       ===================================================== */

    function pauseGPSAutoCentering() {

      if (!gpsEnabled) {

        return;

      }


      userInteractingWithMap = true;


      clearTimeout(
        popupInteractionTimer
      );


      popupInteractionTimer =

        setTimeout(

          function() {

            userInteractingWithMap = false;

          },

          popupPauseDuration

        );

    }


    /* =====================================================
       GPS DETAILS TOGGLE
       ===================================================== */

    function toggleGPSDetails() {

      gpsDetailsVisible =
        !gpsDetailsVisible;


      const button =
        document.getElementById(
          "gpsDetailsButton"
        );


      if (gpsDetailsVisible) {

        button.innerHTML =
          "Hide GPS Details";

        button.classList.add(
          "active"
        );

        displayGPSDetails();

      }

      else {

        button.innerHTML =
          "GPS Details";

        button.classList.remove(
          "active"
        );

        setStatus("");

      }

    }


    /* =====================================================
       DISPLAY GPS DETAILS
       ===================================================== */

    function displayGPSDetails() {

      if (!latestGPSData) {

        setStatus(
          "Waiting for GPS location..."
        );

        return;

      }


      const data =
        latestGPSData;


      const stateText =
        data.state ||
        "Outside current historical coverage";


      setStatus(

        "Latitude: " +
        data.latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +
        data.longitude.toFixed(6) +

        "<br>" +

        "Accuracy: approximately " +
        Math.round(data.accuracy) +
        " meters" +

        "<br>" +

        "Historical dataset: " +
        stateText

      );

    }


    /* =====================================================
       DETERMINE MICHIGAN COVERAGE
       ===================================================== */

    function getHistoricalState(

      latitude,
      longitude

    ) {

      const inMichigan =

        (

          longitude >= -90.5 &&

          longitude <= -82.0 &&

          latitude >= 41.5 &&

          latitude <= 49.0

        );


      if (inMichigan) {

        return "Michigan";

      }


      return null;

    }


    /* =====================================================
       FLORISTIC / CLIMATIC TENSION ZONE
       ===================================================== */

    function tensionZoneLatitude(longitude) {

      const westLon =
        -86.0;

      const eastLon =
        -82.0;

      const westLat =
        43.55;

      const eastLat =
        42.75;


      const fraction =

        (

          longitude -
          westLon

        ) /

        (

          eastLon -
          westLon

        );


      return (

        westLat +

        fraction *

        (

          eastLat -
          westLat

        )

      );

    }


    function isSouthOfTensionZone(

      latitude,
      longitude

    ) {

      return (

        latitude <
        tensionZoneLatitude(
          longitude
        )

      );

    }


    /* =====================================================
       MNFI COMMUNITY PAGE LINKS
       ===================================================== */

    const mnfiCommunityURLs = {

      "mesic northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10687/mesic-northern-forest",

      "mesic southern forest":
        "https://mnfi.anr.msu.edu/communities/description/10684/mesic-southern-forest",

      "dry-mesic northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10688/dry-mesic-northern-forest",

      "dry-mesic southern forest":
        "https://mnfi.anr.msu.edu/communities/description/10685/dry-mesic-southern-forest",

      "dry northern forest":
        "https://mnfi.anr.msu.edu/communities/description/10683/dry-northern-forest",

      "oak barrens":
        "https://mnfi.anr.msu.edu/communities/description/10693/oak-barrens",

      "oak-pine barrens":
        "https://mnfi.anr.msu.edu/communities/description/10692/oak-pine-barrens",

      "pine barrens":
        "https://mnfi.anr.msu.edu/communities/description/10694/pine-barrens",

      "northern hardwood swamp":
        "https://mnfi.anr.msu.edu/communities/description/10659/northern-hardwood-swamp",

      "southern hardwood swamp":
        "https://mnfi.anr.msu.edu/communities/description/10655/southern-hardwood-swamp",

      "hardwood-conifer swamp":
        "https://mnfi.anr.msu.edu/communities/description/10656/hardwood-conifer-swamp",

      "rich conifer swamp":
        "https://mnfi.anr.msu.edu/communities/description/10652/rich-conifer-swamp",

      "dry sand prairie":
        "https://mnfi.anr.msu.edu/communities/description/10698/dry-sand-prairie",

      "dry-mesic prairie":
        "https://mnfi.anr.msu.edu/communities/description/10708/dry-mesic-prairie",

      "mesic prairie":
        "https://mnfi.anr.msu.edu/communities/description/10697/mesic-prairie",

      "mesic sand prairie":
        "https://mnfi.anr.msu.edu/communities/description/10696/mesic-sand-prairie",

      "wet prairie":
        "https://mnfi.anr.msu.edu/communities/description/10665/wet-prairie",

      "wet-mesic prairie":
        "https://mnfi.anr.msu.edu/communities/description/10674/wet-mesic-prairie",

      "wet-mesic sand prairie":
        "https://mnfi.anr.msu.edu/communities/description/10682/wet-mesic-sand-prairie",

      "emergent marsh":
        "https://mnfi.anr.msu.edu/communities/description/10654/emergent-marsh",

      "northern shrub thicket":
        "https://mnfi.anr.msu.edu/communities/description/10677/northern-shrub-thicket",

      "southern shrub-carr":
        "https://mnfi.anr.msu.edu/communities/description/10676/southern-shrub-carr",

      "northern wet meadow":
        "https://mnfi.anr.msu.edu/communities/description/10678/northern-wet-meadow",

      "southern wet meadow":
        "https://mnfi.anr.msu.edu/communities/description/10657/southern-wet-meadow",

      "open dunes":
        "https://mnfi.anr.msu.edu/communities/description/10699/open-dunes",

      "wooded dune and swale complex":
        "https://mnfi.anr.msu.edu/communities/description/10679/wooded-dune-and-swale-complex"

    };


    /* =====================================================
       DETERMINE MNFI COMMUNITY / COMMUNITIES
       ===================================================== */

    function getMNFICommunity(

      coverType,
      latitude,
      longitude

    ) {

      if (!coverType) {

        return null;

      }


      const type =

        String(coverType)
          .trim()
          .toUpperCase();


      const south =

        isSouthOfTensionZone(

          latitude,
          longitude

        );


      if (
        type ===
        "BEECH-SUGAR MAPLE FOREST"
      ) {

        if (south) {

          return {

            name:
              "Mesic Southern Forest",

            url:
              mnfiCommunityURLs[
                "mesic southern forest"
              ],

            tensionSensitive:
              true

          };

        }


        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            true

        };

      }


      if (
        type ===
        "BEECH-SUGAR MAPLE-HEMLOCK FOREST"
      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "SUGAR MAPLE-BASSWOOD FOREST"
      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "SUGAR MAPLE-HEMLOCK FOREST"
      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "SUGAR MAPLE-YELLOW BIRCH FOREST"
      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "OAK-HICKORY FOREST"
      ) {

        return {

          name:
            "Dry-mesic Southern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic southern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "MIXED OAK FOREST"
      ) {

        if (south) {

          return {

            name:
              "Dry-mesic Southern Forest",

            url:
              mnfiCommunityURLs[
                "dry-mesic southern forest"
              ],

            tensionSensitive:
              true

          };

        }


        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            true

        };

      }


      if (
        type ===
        "MIXED PINE-OAK FOREST"
      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "WHITE PINE-WHITE OAK FOREST"
      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "WHITE PINE-MIXED HARDWOOD FOREST"
      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "WHITE PINE-RED PINE FOREST"
      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "JACK PINE-RED PINE FOREST"
      ) {

        return {

          name:
            "Dry Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "HEMLOCK-WHITE PINE FOREST"
      ) {

        return {

          name:
            "Dry-mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "dry-mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "HEMLOCK-YELLOW BIRCH FOREST"
      ) {

        return {

          name:
            "Mesic Northern Forest",

          url:
            mnfiCommunityURLs[
              "mesic northern forest"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "BLACK OAK BARREN"
      ) {

        return {

          name:
            "Oak Barrens",

          url:
            mnfiCommunityURLs[
              "oak barrens"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "OAK/PINE BARRENS"
      ) {

        return {

          name:
            "Oak-Pine Barrens",

          url:
            mnfiCommunityURLs[
              "oak-pine barrens"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "PINE BARRENS"
      ) {

        return {

          name:
            "Pine Barrens",

          url:
            mnfiCommunityURLs[
              "pine barrens"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "CEDAR SWAMP"
      ) {

        return {

          name:
            "Rich Conifer Swamp",

          url:
            mnfiCommunityURLs[
              "rich conifer swamp"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "MIXED CONIFER SWAMP"
      ) {

        return {

          name:
            "Rich Conifer Swamp",

          url:
            mnfiCommunityURLs[
              "rich conifer swamp"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "MIXED HARDWOOD SWAMP"
      ) {

        return {

          name:
            "Southern Hardwood Swamp",

          url:
            mnfiCommunityURLs[
              "southern hardwood swamp"
            ],

          tensionSensitive:
            false

        };

      }


      if (
        type ===
        "BLACK ASH SWAMP"
      ) {

        return {

          communities: [

            {

              name:
                "Northern Hardwood Swamp",

              url:
                mnfiCommunityURLs[

    /* =====================================================
       CREATE MNFI LINKS
       ===================================================== */

    function createMNFILink(

      coverType,
      latitude,
      longitude

    ) {

      const community =
        getMNFICommunity(

          coverType,
          latitude,
          longitude

        );


      if (!community) {

        return "";

      }


      let html = "";


      if (
        community.url &&
        community.name
      ) {

        html +=

          '<a class="mnfi-link" ' +

          'href="' +
          community.url +
          '" ' +

          'target="_blank" ' +

          'rel="noopener noreferrer">' +

          "View MNFI: " +
          community.name +

          "</a>";

      }


      if (
        community.communities &&
        community.communities.length > 0
      ) {

        html +=

          '<div class="mnfi-link-group">' +

          '<div class="mnfi-link-group-title">' +

          "Potential MNFI community equivalents:" +

          "</div>";


        community.communities.forEach(

          function(item) {

            html +=

              '<a class="mnfi-link" ' +

              'href="' +
              item.url +
              '" ' +

              'target="_blank" ' +

              'rel="noopener noreferrer">' +

              "View MNFI: " +
              item.name +

              "</a>";

          }

        );


        html +=
          "</div>";

      }


      if (community.note) {

        html +=

          '<div class="mnfi-note">' +

          community.note +

          "</div>";

      }


      if (
        community.tensionSensitive
      ) {

        const sideText =

          isSouthOfTensionZone(
            latitude,
            longitude
          )

            ? "South of"
            : "North of";


        html +=

          '<div class="tension-note">' +

          "Community selected as " +

          "<strong>" +

          sideText +

          " the approximate floristic tension zone</strong> " +

          "using the current straight-line approximation." +

          "</div>";

      }


      return html;

    }

    /* =====================================================
       START GPS
       ===================================================== */

    function startGPS() {

      if (!navigator.geolocation) {

        setStatus(
          "GPS is not supported by this device."
        );

        return;

      }


      gpsEnabled =
        true;


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS ON";

      gpsButton.classList.add(
        "active"
      );


      gpsHasCentered =
        false;

      lastMapCenterTime =
        0;

      lastVegetationCenter =
        null;

      lastVegetationPosition =
        null;

      latestGPSData =
        null;


      gpsDetailsVisible =
        false;


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsButton.innerHTML =
        "GPS Details";


      gpsDetailsButton.classList.remove(
        "active"
      );


      setStatus("");


      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

      }


      watchID =

        navigator.geolocation.watchPosition(

          function(position) {

            if (!gpsEnabled) {

              return;

            }


            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            const gpsLatLng =
              [
                latitude,
                longitude
              ];


            if (!gpsMarker) {

              gpsMarker =

                L.circleMarker(

                  gpsLatLng,

                  {

                    radius: 9,

                    color: "white",

                    weight: 3,

                    fillColor: "#0077ff",

                    fillOpacity: 1

                  }

                ).addTo(map);

            }

            else {

              gpsMarker.setLatLng(
                gpsLatLng
              );

            }


            if (!gpsAccuracyCircle) {

              gpsAccuracyCircle =

                L.circle(

                  gpsLatLng,

                  {

                    radius: accuracy,

                    color: "#0077ff",

                    fillOpacity: 0.08,

                    weight: 1

                  }

                ).addTo(map);

            }

            else {

              gpsAccuracyCircle.setLatLng(
                gpsLatLng
              );

              gpsAccuracyCircle.setRadius(
                accuracy
              );

            }


            const state =

              getHistoricalState(

                latitude,
                longitude

              );


            lastState =
              state;


            latestGPSData = {

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              state:
                state

            };


            const gpsDetailsButton =

              document.getElementById(
                "gpsDetailsButton"
              );


            gpsDetailsButton.style.display =
              "inline-block";


            if (gpsDetailsVisible) {

              displayGPSDetails();

            }


            const now =
              Date.now();


            if (
              !userInteractingWithMap
            ) {

              if (!gpsHasCentered) {

                map.setView(

                  gpsLatLng,

                  15,

                  {

                    animate:
                      false

                  }

                );


                gpsHasCentered =
                  true;

                lastMapCenterTime =
                  now;


                if (
                  vegetationVisible
                ) {

                  loadVegetation();

                }

                if (
                  cornersVisible
                ) {

                  loadCorners();

                }

                if (
                  governmentParcelsVisible
                ) {

                  loadGovernmentParcels();

                }

              }

              else if (

                now -
                lastMapCenterTime >=
                gpsCenterInterval

              ) {

                map.setView(

                  gpsLatLng,

                  map.getZoom(),

                  {

                    animate:
                      false

                  }

                );


                lastMapCenterTime =
                  now;

              }

            }


            if (
              currentVegetationVisible
            ) {

              updateCurrentVegetation(

                latitude,
                longitude

              );

            }

          },


          function(error) {

            if (!gpsEnabled) {

              return;

            }


            if (gpsDetailsVisible) {

              setStatus(

                "GPS error: " +
                error.message

              );

            }

          },


          {

            enableHighAccuracy:
              true,

            maximumAge:
              1000,

            timeout:
              15000

          }

        );

    }


    /* =====================================================
       STOP GPS
       ===================================================== */

    function stopGPS() {

      gpsEnabled =
        false;


      if (watchID !== null) {

        navigator.geolocation.clearWatch(
          watchID
        );

        watchID =
          null;

      }


      const gpsButton =
        document.getElementById(
          "gpsButton"
        );


      gpsButton.innerHTML =
        "GPS OFF";

      gpsButton.classList.remove(
        "active"
      );


      const gpsDetailsButton =
        document.getElementById(
          "gpsDetailsButton"
        );


      gpsDetailsButton.style.display =
        "none";


      gpsDetailsVisible =
        false;


      latestGPSData =
        null;


      if (gpsMarker) {

        map.removeLayer(
          gpsMarker
        );

        gpsMarker =
          null;

      }


      if (gpsAccuracyCircle) {

        map.removeLayer(
          gpsAccuracyCircle
        );

        gpsAccuracyCircle =
          null;

      }


      userInteractingWithMap =
        false;


      clearTimeout(
        popupInteractionTimer
      );


      popupInteractionTimer =
        null;


      setStatus(
        "GPS off"
      );

    }

    /* =====================================================
       LOAD VEGETATION
       ===================================================== */

    async function loadVegetation() {

      if (map.getZoom() < 10) {

        setStatus(

          "Zoom in closer to load historical vegetation."

        );

        return;

      }


      const center =
        map.getCenter();


      const state =
        getHistoricalState(

          center.lat,
          center.lng

        );


      if (state !== "Michigan") {

        setStatus(

          "Move the map into Michigan to load historical vegetation."

        );

        return;

      }


      if (lastVegetationCenter) {

        const movedDistance =

          map.distance(

            lastVegetationCenter,
            center

          );


        if (
          movedDistance < 250
        ) {

          return;

        }

      }


      lastVegetationCenter =
        center;


      const bounds =
        map.getBounds();


      const geometry =

        JSON.stringify({

          xmin:
            bounds.getWest(),

          ymin:
            bounds.getSouth(),

          xmax:
            bounds.getEast(),

          ymax:
            bounds.getNorth(),

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryEnvelope",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME",

          returnGeometry:
            "true",

          outSR:
            "4326",

          f:
            "geojson"

        });


      try {

        const response =

          await fetch(

            michiganURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          setStatus(

            "No historical vegetation polygons were returned."

          );

          return;

        }


        if (vegetationLayer) {

          map.removeLayer(
            vegetationLayer
          );

        }


        vegetationLayer =

          L.geoJSON(

            data,

            {

              style:

                function(feature) {

                  const p =
                    feature.properties;


                  const color =

                    getMichiganVegetationColor(

                      p.COVERTYPE

                    );


                  return {

                    color:
                      "#777777",

                    weight:
                      0.5,

                    opacity:
                      0.45,

                    fillColor:
                      color,

                    fillOpacity:
                      0.65

                  };

                },


              onEachFeature:

                function(
                  feature,
                  layer
                ) {

                  const p =
                    feature.properties;


                  let polygonCenter;


                  try {

                    polygonCenter =
                      layer.getBounds().getCenter();

                  }

                  catch(error) {

                    polygonCenter =
                      map.getCenter();

                  }


                  const clickLatitude =
                    polygonCenter.lat;

                  const clickLongitude =
                    polygonCenter.lng;


                  const coverType =
                    p.COVERTYPE ||
                    "Unknown";


                  const communityLink =

                    createMNFILink(

                      coverType,

                      clickLatitude,

                      clickLongitude

                    );


                  let popup =

                    "<strong>" +

                    "Michigan Circa-1800 Vegetation" +

                    "</strong>" +

                    "<br><br>" +

                    "<strong>Historical cover type:</strong><br>" +

                    coverType +

                    "<br><br>" +

                    "<strong>Vegetation code:</strong> " +

                    (

                      p.VEGCODE ||
                      "Unknown"

                    ) +

                    "<br><br>" +

                    "<strong>County:</strong> " +

                    (

                      p.CNTY_NAME ||
                      "Unknown"

                    );


                  popup +=
                    communityLink;


                  layer.bindPopup(

                    popup,

                    {

                      closeButton:
                        true,

                      autoPan:
                        true,

                      autoPanPadding:
                        [30, 30]

                    }

                  );


                  layer.on(

                    "click",

                    function(e) {

                      pauseGPSAutoCentering();


                      if (
                        e.originalEvent
                      ) {

                        L.DomEvent.stopPropagation(
                          e.originalEvent
                        );

                      }


                      layer.openPopup();

                    }

                  );


                  layer.on(

                    "touchstart",

                    function() {

                      pauseGPSAutoCentering();

                    }

                  );


                  layer.on(

                    "mouseover",

                    function(e) {

                      e.target.setStyle({

                        weight:
                          1,

                        color:
                          "#666666",

                        opacity:
                          0.7,

                        fillOpacity:
                          0.72

                      });

                    }

                  );


                  layer.on(

                    "mouseout",

                    function(e) {

                      if (
                        vegetationLayer
                      ) {

                        vegetationLayer.resetStyle(
                          e.target
                        );

                      }

                    }

                  );


                  layer.on(

                    "popupopen",

                    function() {

                      popupIsOpen =
                        true;


                      pauseGPSAutoCentering();

                    }

                  );


                  layer.on(

                    "popupclose",

                    function() {

                      popupIsOpen =
                        false;

                    }

                  );

                }

            }

          );


        vegetationLayer.addTo(
          map
        );


        if (gpsDetailsVisible) {

          displayGPSDetails();

        }

        else {

          setStatus("");

        }

      }


      catch(error) {

        console.error(

          "Vegetation loading error:",
          error

        );


        setStatus(

          "Vegetation error:<br>" +
          error.message

        );

      }

    }

    /* =====================================================
       LOAD GLO CORNERS
       ===================================================== */

    async function loadCorners() {

      /*
       * At broad Michigan-wide extents, thousands of points
       * can be returned. Require a moderately close zoom.
       */

      if (map.getZoom() < 10) {

        setStatus(

          "Zoom in closer to display GLO survey corners."

        );

        return;

      }


      const center =
        map.getCenter();


      if (
        getHistoricalState(
          center.lat,
          center.lng
        ) !== "Michigan"
      ) {

        setStatus(

          "GLO survey-corner data is available within Michigan."

        );

        return;

      }


      if (cornersLastCenter) {

        if (

          map.distance(
            cornersLastCenter,
            center
          ) < 500

        ) {

          if (
            cornersLayer &&
            !map.hasLayer(cornersLayer)
          ) {

            cornersLayer.addTo(map);

          }

          return;

        }

      }


      cornersLastCenter =
        center;


      const bounds =
        map.getBounds();


      const geometry =

        JSON.stringify({

          xmin:
            bounds.getWest(),

          ymin:
            bounds.getSouth(),

          xmax:
            bounds.getEast(),

          ymax:
            bounds.getNorth(),

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryEnvelope",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            "OBJECTID,Corner_Code,Corner_Status,Range,Town,PS_ID,Recorded_Date,Latitude_N,Longitude_W,Researched_Date,Observe_Date",

          returnGeometry:
            "true",

          outSR:
            "4326",

          resultRecordCount:
            "2000",

          f:
            "geojson"

        });


      try {

        const response =

          await fetch(

            cornersURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "GLO corner server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "GLO corner ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          setStatus(

            "No GLO survey corners were returned at this map extent."

          );

          return;

        }


        if (cornersLayer) {

          map.removeLayer(
            cornersLayer
          );

        }


        cornersLayer =

          L.geoJSON(

            data,

            {

              pointToLayer:

                function(
                  feature,
                  latlng
                ) {

                  return L.circleMarker(

                    latlng,

                    {

                      radius:
                        3,

                      color:
                        "#174d2a",

                      weight:
                        1,

                      fillColor:
                        "#245f35",

                      fillOpacity:
                        0.9

                    }

                  );

                },


              onEachFeature:

                function(
                  feature,
                  layer
                ) {

                  const p =
                    feature.properties ||
                    {};


                  const cornerCode =
                    p.Corner_Code ||
                    "Unknown";


                  const status =
                    p.Corner_Status ||
                    "Unknown";


                  const township =
                    p.Town ||
                    "Unknown";


                  const range =
                    p.Range ||
                    "Unknown";


                  const psID =
                    p.PS_ID ||
                    "Unknown";


                  let popup =

                    "<strong>GLO / Public Land Survey Corner</strong>" +

                    "<br><br>" +

                    "<strong>Corner:</strong> " +

                    cornerCode +

                    "<br>" +

                    "<strong>Status:</strong> " +

                    status +

                    "<br>" +

                    "<strong>Township:</strong> " +

                    township +

                    "<br>" +

                    "<strong>Range:</strong> " +

                    range +

                    "<br>" +

                    "<strong>PS ID:</strong> " +

                    psID;


                  if (
                    p.Recorded_Date
                  ) {

                    popup +=

                      "<br>" +

                      "<strong>Recorded:</strong> " +

                      formatArcGISDate(
                        p.Recorded_Date
                      );

                  }


                  if (
                    p.Researched_Date
                  ) {

                    popup +=

                      "<br>" +

                      "<strong>Survey research date:</strong> " +

                      p.Researched_Date;

                  }


                  if (
                    p.Observe_Date
                  ) {

                    popup +=

                      "<br>" +

                      "<strong>Observation date:</strong> " +

                      formatArcGISDate(
                        p.Observe_Date
                      );

                  }


                  layer.bindPopup(

                    popup,

                    {

                      closeButton:
                        true,

                      autoPan:
                        true,

                      autoPanPadding:
                        [30, 30]

                    }

                  );


                  layer.on(

                    "click",

                    function(e) {

                      pauseGPSAutoCentering();


                      if (
                        e.originalEvent
                      ) {

                        L.DomEvent.stopPropagation(
                          e.originalEvent
                        );

                      }

                    }

                  );


                  layer.on(

                    "popupopen",

                    function() {

                      pauseGPSAutoCentering();

                    }

                  );

                }

            }

          );


        if (cornersVisible) {

          cornersLayer.addTo(
            map
          );

        }


        setStatus("");

      }


      catch(error) {

        console.error(

          "GLO corner loading error:",
          error

        );


        setStatus(

          "GLO corner error:<br>" +
          error.message

        );

      }

    }


    /* =====================================================
       FORMAT ARCGIS DATE
       ===================================================== */

    function formatArcGISDate(
      value
    ) {

      if (!value) {

        return "";

      }


      try {

        const date =
          new Date(value);


        if (
          isNaN(date.getTime())
        ) {

          return String(value);

        }


        return date.toLocaleDateString();

      }

      catch(error) {

        return String(value);

      }

    }

        );


      if (!governmentParcelsVisible) {

        button.innerHTML =
          "GOV Parcels OFF";

        button.classList.remove(
          "active"
        );


        if (dnrLayer) {

          map.removeLayer(
            dnrLayer
          );

        }


        if (usfsLayer) {

          map.removeLayer(
            usfsLayer
          );

        }


        return;

      }


      button.innerHTML =
        "GOV Parcels ON";

      button.classList.add(
        "active"
      );


      setStatus(
        "Loading government parcels..."
      );


      governmentLastCenter =
        null;


      loadGovernmentParcels();

    }


    /* =====================================================
       LOAD GOVERNMENT PARCELS
       ===================================================== */

    async function loadGovernmentParcels() {

      if (map.getZoom() < 9) {

        setStatus(

          "Zoom in closer to display government parcels."

        );

        return;

      }


      const center =
        map.getCenter();


      if (
        getHistoricalState(
          center.lat,
          center.lng
        ) !== "Michigan"
      ) {

        setStatus(

          "Government parcel data is currently shown within Michigan."

        );

        return;

      }


      if (governmentLastCenter) {

        if (

          map.distance(
            governmentLastCenter,
            center
          ) < 500

        ) {

          if (
            dnrLayer &&
            !map.hasLayer(dnrLayer)
          ) {

            dnrLayer.addTo(map);

          }


          if (
            usfsLayer &&
            !map.hasLayer(usfsLayer)
          ) {

            usfsLayer.addTo(map);

          }


          return;

        }

      }


      governmentLastCenter =
        center;


      /*
       * Load both datasets independently.
       */

      await Promise.all([

        loadDNRLayer(),

        loadUSFSLayer()

      ]);


      setStatus("");

    }


    /* =====================================================
       LOAD DNR LAYER
       ===================================================== */

    async function loadDNRLayer() {

      const bounds =
        map.getBounds();


      const geometry =

        JSON.stringify({

          xmin:
            bounds.getWest(),

          ymin:
            bounds.getSouth(),

          xmax:
            bounds.getEast(),

          ymax:
            bounds.getNorth(),

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryEnvelope",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            "*",

          returnGeometry:
            "true",

          outSR:
            "4326",

          f:
            "geojson"

        });


      try {

        const response =

          await fetch(

            dnrURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "DNR server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "DNR ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          console.warn(
            "No DNR parcels returned."
          );

          return;

        }


        if (dnrLayer) {

          map.removeLayer(
            dnrLayer
          );

        }


        dnrLayer =

          L.geoJSON(

            data,

            {

              /*
               * DNR ownership remains green.
               *
               * The relatively transparent fill is intentional:
               * the underlying GLO polygons remain visible.
               */

              style:

                function() {

                  return {

                    color:
                      "#28752b",

                    weight:
                      0.7,

                    opacity:
                      0.55,

                    fillColor:
                      "#4caf50",

                    fillOpacity:
                      0.20

                  };

                },


              onEachFeature:

                function(
                  feature,
                  layer
                ) {

                  layer.on(

                    "click",

                    function() {

                      pauseGPSAutoCentering();

                    }

                  );

                }

            }

          );


        if (
          governmentParcelsVisible
        ) {

          dnrLayer.addTo(
            map
          );

        }

      }


      catch(error) {

        console.error(

          "DNR parcel loading error:",
          error

        );


        setStatus(

          "DNR parcel error:<br>" +
          error.message

        );

      }

    }

                  };

                },

                function(

    /* =====================================================
       WHAT WAS HERE? TOGGLE
       ===================================================== */

    function toggleCurrentVegetation() {

      currentVegetationVisible =
        !currentVegetationVisible;


      const button =
        document.getElementById(
          "currentButton"
        );


      const box =
        document.getElementById(
          "currentVegetation"
        );


      if (!currentVegetationVisible) {

        button.classList.remove(
          "active"
        );

        box.style.display =
          "none";

        return;

      }


      button.classList.add(
        "active"
      );


      box.style.display =
        "block";


      if (!gpsMarker) {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "Turn GPS on first";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "Your current location is needed to identify the historical vegetation.";

        return;

      }


      const position =
        gpsMarker.getLatLng();


      updateCurrentVegetation(

        position.lat,
        position.lng

      );

    }


    /* =====================================================
       UPDATE CURRENT VEGETATION
       ===================================================== */

    async function updateCurrentVegetation(

      latitude,
      longitude

    ) {

      const state =
        getHistoricalState(

          latitude,
          longitude

        );


      const positionKey =

        state +
        "|" +
        latitude.toFixed(5) +
        "," +
        longitude.toFixed(5);


      if (

        positionKey ===
        lastVegetationPosition

      ) {

        return;

      }


      lastVegetationPosition =
        positionKey;


      if (state !== "Michigan") {

        document.getElementById(
          "currentType"
        ).innerHTML =
          "No historical dataset";


        document.getElementById(
          "currentDetails"
        ).innerHTML =

          "The current GPS location is outside the Michigan historical vegetation dataset.";

        return;

      }


      const geometry =

        JSON.stringify({

          x:
            longitude,

          y:
            latitude,

          spatialReference: {

            wkid:
              4326

          }

        });


      const params =

        new URLSearchParams({

          where:
            "1=1",

          geometry:
            geometry,

          geometryType:
            "esriGeometryPoint",

          inSR:
            "4326",

          spatialRel:
            "esriSpatialRelIntersects",

          outFields:
            "VEGCODE,LEGCODE,COVERTYPE,CNTY_NAME",

          returnGeometry:
            "false",

          outSR:
            "4326",

          f:
            "json"

        });


      try {

        const response =

          await fetch(

            michiganURL +
            "/query?" +
            params.toString()

          );


        if (!response.ok) {

          throw new Error(

            "Server returned HTTP " +
            response.status

          );

        }


        const data =
          await response.json();


        if (data.error) {

          throw new Error(

            data.error.message ||
            "ArcGIS returned an error."

          );

        }


        if (
          !data.features ||
          data.features.length === 0
        ) {

          document.getElementById(
            "currentType"
          ).innerHTML =

            "No mapped historical vegetation";


          document.getElementById(
            "currentDetails"
          ).innerHTML =

            "No historical polygon was found at your GPS location.";

          return;

        }


        const properties =
          data.features[0].attributes;


        const coverType =
          properties.COVERTYPE ||
          "Unknown";


        const vegCode =
          properties.VEGCODE ||
          "Unknown";


        const county =
          properties.CNTY_NAME ||
          "Unknown";


        document.getElementById(
          "currentType"
        ).innerHTML =

          formatVegetationName(
            coverType
          );


        let details =

          "<strong>Michigan MNFI circa-1800</strong>" +

          "<br>" +

          "Vegetation code: " +
          vegCode +

          "<br>" +

          "County: " +
          county;


        const community =

          getMNFICommunity(

            coverType,

            latitude,

            longitude

          );


        if (community) {

          if (
            community.name &&
            community.url
          ) {

            details +=

              "<br><br>" +

              "<strong>MNFI community:</strong> " +
              community.name;


            if (
              community.tensionSensitive
            ) {

              details +=

                "<br>" +

                (

                  isSouthOfTensionZone(
                    latitude,
                    longitude
                  )

                    ? "South of"
                    : "North of"

                ) +

                " approximate tension zone";

            }


            details +=

              '<a class="mnfi-link" ' +

              'href="' +
              community.url +
              '" ' +

              'target="_blank" ' +

              'rel="noopener noreferrer">' +

              "View MNFI: " +
              community.name +

              "</a>";

          }


          if (
            community.communities &&
            community.communities.length > 0
          ) {

            details +=

              "<br><br>" +

              "<strong>Potential MNFI community equivalents:</strong>";


            community.communities.forEach(

              function(item) {

                details +=

                  '<a class="mnfi-link" ' +

                  'href="' +
                  item.url +
                  '" ' +

                  'target="_blank" ' +

                  'rel="noopener noreferrer">' +

                  "View MNFI: " +
                  item.name +

                  "</a>";

              }

            );

          }


          if (community.note) {

            details +=

              '<div class="mnfi-note">' +

              community.note +

              "</div>";

          }

        }


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          details;

      }


      catch(error) {

        console.error(

          "Current vegetation error:",
          error

        );


        document.getElementById(
          "currentType"
        ).innerHTML =
          "Unable to identify vegetation";


        document.getElementById(
          "currentDetails"
        ).innerHTML =
          error.message;

      }

    }


    /* =====================================================
       FORMAT VEGETATION NAME
       ===================================================== */

    function formatVegetationName(
      name
    ) {

      if (!name) {

        return "Unknown";

      }


      return name
        .toLowerCase()
        .replace(

          /\b\w/g,

          function(letter) {

            return letter.toUpperCase();

          }

        );

    }

    /* =====================================================
       MAP MOVE / LAYER RELOAD
       ===================================================== */

    let reloadTimer =
      null;


    map.on(

      "moveend",

      function() {

        clearTimeout(
          reloadTimer
        );


        reloadTimer =

          setTimeout(

            function() {

              if (
                vegetationVisible &&
                !popupIsOpen
              ) {

                loadVegetation();

              }


              if (
                cornersVisible
              ) {

                loadCorners();

              }


              if (
                governmentParcelsVisible
              ) {

                loadGovernmentParcels();

              }

            },

            750

          );

      }

    );


    /* =====================================================
       POPUP CLOSE
       ===================================================== */

    map.on(

      "popupclose",

      function() {

        popupIsOpen =
          false;

      }

    );


    /* =====================================================
       USER MAP INTERACTION
       ===================================================== */

    map.on(

      "dragstart",

      function() {

        pauseGPSAutoCentering();

      }

    );


    map.on(

      "zoomstart",

      function() {

        pauseGPSAutoCentering();

      }

    );


  </script>
